<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Test</title><style>
body{font-family:monospace;background:#0a0a0f;color:#fff;padding:20px;font-size:14px;line-height:1.6}
.ok{color:#0f0}.err{color:#f33}.warn{color:#fb0}
pre{background:#14141c;padding:10px;border-radius:6px;white-space:pre-wrap;word-break:break-all}
</style></head><body>
<h2>WS TEST</h2>
<pre id=out>starting...</pre>
<script>
var out=document.getElementById('out');
function log(m,c){out.innerHTML += '<span class="'+(c||'')+'">'+m+'</span>\n'}
log('1. Page loaded. URL: '+location.href);
log('2. Protocol: '+location.protocol);
log('3. Host: '+location.host);
try{
  var u=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
  log('4. WS target: '+u);
  var ws=new WebSocket(u);
  log('5. WebSocket created', 'ok');
  ws.onopen=function(){log('6. ✅ WS OPEN — server menerima koneksi!','ok');ws.send(JSON.stringify({type:'register',no:'08111'}));log('7. Sent register 08111')};
  ws.onmessage=function(e){log('8. MSG: '+e.data,'ok')};
  ws.onerror=function(e){log('9. ❌ WS ERROR','err')};
  ws.onclose=function(e){log('10. ❌ WS CLOSED code='+e.code+' reason='+e.reason,'err')};
}catch(e){log('❌ EXCEPTION: '+e.message,'err')}
log('---\nJika stuck di langkah 5-6 = HP tidak bisa WS ke server\nJika 6 muncul = HP bisa WS, masalah di kode walkie');
</script></body></html>

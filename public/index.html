d);color:#fff;text-align:center;font-size:.65rem;font-weight:700;padding:4px;letter-spacing:2px;text-transform:uppercase;z-index:1000;transform:translateY(-100%);transition:.3s}.ob.on{transform:translateY(0)}audio{display:none}.fab{position:fixed;bottom:18px;right:12px;display:flex;flex-direction:column;gap:10px;z-index:99}.fb{width:52px;height:52px;border-radius:50%;background:linear-gradient(180deg,#2a2a35,#15151c);border:2px solid #2a2a35;color:#888;font-size:1.4rem;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 4px 12px rgba(0,0,0,.5);transition:.2s}</style></head>

<script>

const $=i=>document.getElementById(i),cl=n=>String(n||'').replace(/\D/g,''),lg=(...a)=>console.log('[WT]',...a);

let ws,wr=0,retry=0,pt=0,my=localStorage.getItem('myNo')||'',tg='',caller=0,pc,ls,rs,pend=[],rds=0,raf,rp=0,rT,po=null,pf=null,ac,an,dt=null,myLoc=null,peerLoc=null,activeTx=null,ngOn=0,echoGate=0,rxChain=null,rxLevel=1,micAnalyser=null,micData=null,fbCount=0,fbLast=0,tailTimer=null,ngNodes=null;
const ra=$('ra');ra.muted=true;
const net=(s,t)=>{
  $('led').className='ind'+(s==='ok'?' o':(s==='w'?' n':''));
  $('nt').textContent=t.toUpperCase();
  const cb=$('cb');if(cb)cb.disabled=s!=='ok';
};
const rbR=()=>{
  const rb=$('rb');if(!rb)return;
  rb.textContent='Mulai';rb.disabled=0;
  $('mn').disabled=0;
};
fetch('/prewarm').catch(()=>{});
let lp=null;
async function gm(){
  if(ls)return ls;if(lp)return lp;
  lp=(async()=>{
    if(!navigator.mediaDevices)throw Error('No mic');
    const tries=[
      {audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1,sampleRate:48000,googEchoCancellation:true,googAutoGainControl:true,googNoiseSuppression:true,googHighpassFilter:true,googAudioMirroring:false},video:false},
      {audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false},
      {audio:true,video:false}
    ];
    let st,err;
    for(const c of tries){try{st=await navigator.mediaDevices.getUserMedia(c);break}catch(e){err=e}}
    if(!st)throw err;
    ls=st;st.getAudioTracks().forEach(t=>t.enabled=false);
    activeTx=st.getAudioTracks()[0];
    lg('🎤MIC OK');
    return st;
  })().catch(e=>{lp=null;throw e});
  return lp;
}
gm().catch(()=>lg('pre-mic gesture'));
document.addEventListener('touchstart',()=>{if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});if(!ls)gm().catch(()=>{})},{once:true,passive:true});
document.addEventListener('click',()=>{if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});if(!ls)gm().catch(()=>{})},{once:true});

function initRxChain(stream){
  if(rxChain)return;
  try{
    if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'})}catch{return}}
    if(ac.state==='suspended')ac.resume().catch(()=>{});
    const src=ac.createMediaStreamSource(stream);
    const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=150;hp.Q.value=.7;
    const nt1=ac.createBiquadFilter();nt1.type='notch';nt1.frequency.value=50;nt1.Q.value=8;
    const nt2=ac.createBiquadFilter();nt2.type='notch';nt2.frequency.value=60;nt2.Q.value=8;
    const pres=ac.createBiquadFilter();pres.type='peaking';pres.frequency.value=2500;pres.Q.value=1;pres.gain.value=3;
    const gain=ac.createGain();gain.gain.value=0;
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-12;comp.knee.value=4;comp.ratio.value=6;comp.attack.value=.002;comp.release.value=.15;
    const out=ac.createGain();out.gain.value=.9;
    src.connect(hp).connect(nt1).connect(nt2).connect(pres).connect(gain).connect(comp).connect(out).connect(ac.destination);
    rxChain={src,gain,out};
    try{ra.muted=true}catch(_){}
    lg('🔊RX chain aktif');
  }catch(e){lg('chain err',e.message)}
}
function setRxLevel(v,ramp){
  rxLevel=v;
  if(!rxChain){try{ra.volume=v}catch(_){};return}
  try{
    const t=ac.currentTime,g=rxChain.gain.gain;
    if(v===0){g.cancelScheduledValues(t);g.setValueAtTime(0,t)}
    else if(ramp){g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(v,t+ramp)}
    else{g.setValueAtTime(v,t)}
  }catch(e){}
}
function setTxTrack(track){
  if(!track)return;activeTx=track;
  if(pc){
    const snd=pc.getSenders().find(x=>x.track&&x.track.kind==='audio');
    if(snd){snd.replaceTrack(track).then(()=>{track.enabled=false;lg('🎤Tx:',track.label||'proc')}).catch(e=>lg('rT err',e.message));return}
  }
  track.enabled=false;
}
let micAnalyser=null,micBuf=null;
function initMicMon(){
  if(micAnalyser||!ls)return;
  try{
    if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'})}catch{return}}
    micAnalyser=ac.createAnalyser();micAnalyser.fftSize=256;
    ac.createMediaStreamSource(ls).connect(micAnalyser);
    micBuf=new Uint8Array(micAnalyser.frequencyBinCount);
  }catch(e){}
}
function feedbackCheck(){
  if(!rxChain)return;
  initMicMon();
  if(!micAnalyser)return;
  const pttOn=$('pb').classList.contains('on');
  if(!pttOn){fbCount=0;fbLast=0;return}
  try{
    micAnalyser.getByteFrequencyData(micBuf);
    let m=0;for(let i=0;i<micBuf.length;i++)m+=micBuf[i];
    const micAvg=m/micBuf.length;
    const now=Date.now();
    if(micAvg>25){
      if(now-fbLast<300)fbCount++;else fbCount=1;
      fbLast=now;
      if(fbCount>=2){
        lg('⚠️FEEDBACK force mute');
        if(rxChain){try{rxChain.gain.gain.cancelScheduledValues(ac.currentTime);rxChain.gain.gain.setValueAtTime(0,ac.currentTime)}catch(_){}}
        try{ra.muted=true}catch(_){}
        ts('⚠️Echo gate','e');fbCount=0;
      }
    }else if(micAvg<10){fbCount=0}
  }catch(e){}
}
setInterval(feedbackCheck,150);

function buildAnt(){
  const a=document.querySelector('.ant');if(!a||a.dataset.built)return;
  a.dataset.built='1';
  lg('📡Antena render');
}
buildAnt();

function toggleGate(){
  echoGate=(echoGate+1)%3;
  const b=$('gbtn');
  const N=['◎','◉','◍'],C=['#888','#00e0ff','#00ff88'];
  b.textContent=N[echoGate];b.style.color=C[echoGate];b.style.borderColor=C[echoGate];
  b.style.boxShadow=echoGate===0?'0 4px 12px rgba(0,0,0,.5)':'0 0 20px '+C[echoGate];
  const names=['NORMAL','ECHO-GATE','CLEAN-GATE'];
  ts('🎛️ '+names[echoGate],echoGate===0?'':'k');
  lg('Gate',names[echoGate]);
  const led=$('led');
  if(led){if(echoGate===1)led.classList.add('echo');else led.classList.remove('echo')}
  if(echoGate===2&&!ngOn)toggleNg();
  else if(echoGate!==2&&ngOn)toggleNg();
}
function toggleNg(){
  ngOn=!ngOn;
  const b=$('ngbtn');
  b.textContent=ngOn?'▣':'▤';
  b.style.color=ngOn?'#ffb300':'#888';
  b.style.borderColor=ngOn?'#ffb300':'#2a2a35';
  b.style.boxShadow=ngOn?'0 0 20px #ffb300':'0 4px 12px rgba(0,0,0,.5)';
  ts(ngOn?'🔇 Noise Gate ON':'🔇 Noise Gate OFF',ngOn?'k':'');
  lg('NG',ngOn?'ON':'OFF');
  if(ngOn)startNg();else stopNg();
}


function applyEchoGate(){
  if(!rxChain)return;
  try{
    if(echoGate===0){setRxLevel(.3,0)}
    else{setRxLevel(0,0)}
  }catch(e){}
}
function releaseEchoGate(){setRxLevel(1,.15)}
let ngNodes=null,ngRaf=null,ngData=null,ngEnv=0,ngFloor=8,ngProc=null;
function startNg(){
  if(ngNodes||!ls)return;
  try{
    if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'})}catch{return}}
    if(ac.state==='suspended')ac.resume().catch(()=>{});
    const src=ac.createMediaStreamSource(ls);
    const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=200;hp.Q.value=.7;
    const n1=ac.createBiquadFilter();n1.type='notch';n1.frequency.value=50;n1.Q.value=10;
    const n2=ac.createBiquadFilter();n2.type='notch';n2.frequency.value=60;n2.Q.value=10;
    const pk=ac.createBiquadFilter();pk.type='peaking';pk.frequency.value=1800;pk.Q.value=1.2;pk.gain.value=6;
    const gate=ac.createGain();gate.gain.value=0;
    const an2=ac.createAnalyser();an2.fftSize=512;an2.smoothingTimeConstant=.6;
    const dest=ac.createMediaStreamDestination();
    src.connect(n1).connect(n2).connect(hp).connect(pk).connect(gate).connect(dest);
    gate.connect(an2);
    ngProc=dest.stream.getAudioTracks()[0];
    if(ngProc)ngProc.enabled=false;
    ngNodes={src,gate,an:an2,dest};
    ngData=new Uint8Array(an2.frequencyBinCount);
    ngEnv=0;ngFloor=8;
    const loop=()=>{
      if(!ngNodes){ngRaf=null;return}
      an2.getByteFrequencyData(ngData);
      const sr=ac.sampleRate,nn=an2.fftSize;
      const bL=Math.max(1,Math.floor(200*nn/sr)),bH=Math.min(ngData.length-1,Math.floor(3400*nn/sr));
      let sum=0,cnt=0;
      for(let i=bL;i<=bH;i++){sum+=ngData[i]*ngData[i];cnt++}
      const rms=Math.sqrt(sum/Math.max(1,cnt));
      if(rms<ngFloor*1.5){ngFloor=ngFloor*.98+rms*.02;if(ngFloor<3)ngFloor=3;if(ngFloor>25)ngFloor=25}
      const op=ngFloor+10,cl=ngFloor+4;
      const tgt=rms>op?1:(rms<cl?0:ngEnv);
      const rate=tgt>ngEnv?.35:.06;
      ngEnv=ngEnv+(tgt-ngEnv)*rate;
      try{gate.gain.setTargetAtTime(ngEnv,ac.currentTime,.02)}catch(_){}
      ngRaf=requestAnimationFrame(loop);
    };
    loop();
    if(pc)setTxTrack(ngProc);
    lg('🔇NG aktif floor='+ngFloor.toFixed(1));
  }catch(e){lg('startNg err',e.message)}
}
function stopNg(){
  if(!ngNodes)return;
  try{ngNodes.src.disconnect();ngNodes.gate.disconnect();ngNodes.dest.disconnect()}catch(_){}
  if(ngRaf){cancelAnimationFrame(ngRaf);ngRaf=null}
  ngNodes=null;ngProc=null;ngData=null;
  if(ls&&ls.getAudioTracks().length){
    const orig=ls.getAudioTracks()[0];
    if(orig){orig.enabled=false;if(pc)setTxTrack(orig);else activeTx=orig}
  }
  lg('🔇NG off');
}
window.addEventListener('error',e=>{lg('❌ERR',e.message,'@',e.lineno);try{ts('❌ '+e.message,'e')}catch(_){}});
function wsC(){
  lg('WS->',WU);net('w','connecting');
  try{ws=new WebSocket(WU)}catch(e){net('','LINK ERROR');setTimeout(wsC,1500);return}
  ws.onopen=()=>{wr=1;retry=0;lg('✅ws OPEN');net('ok','online');startGeo();
    if(my){wsS({type:'register',no:my});rp=1;clearTimeout(rT);rT=setTimeout(()=>{if(rp){ts('timeout','e');rp=0;rbR()}},8e3)}
    clearInterval(pt);pt=setInterval(()=>wsS({type:'ping'}),20000)};

const wsS=o=>{if(ws&&ws.readyState===1){try{ws.send(JSON.stringify(o))}catch(e){}}};
function mt(s){

  const d=new Uint8Array(an.frequencyBinCount);cancelAnimationFrame(raf);let k=0;
  const tk=()=>{
    an.getByteFrequencyData(d);let x=0;for(let i=0;i<d.length;i++)x+=d[i];
    const avg=x/d.length;
    if((k++&3)===0){
      let mv=0,mb=0;for(let i=1;i<d.length;i++)if(d[i]>mv){mv=d[i];mb=i}
      const hz=mb*ac.sampleRate/an.fftSize;

function hav(a,b){const R=6371000,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}

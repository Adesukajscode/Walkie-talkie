<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Walkie</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#0a0a0f;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;padding:20px}
.w{width:100%;max-width:300px;display:flex;flex-direction:column;gap:12px}
h1{text-align:center;font-size:1rem;color:#00e0ff;letter-spacing:3px;margin-bottom:8px}
input{padding:14px;border-radius:10px;border:1px solid #252532;background:#14141c;color:#fff;font-size:1rem;outline:none;width:100%}
input:focus{border-color:#00e0ff}
button{padding:14px;border:none;border-radius:10px;font-weight:700;font-size:.85rem;cursor:pointer;text-transform:uppercase;letter-spacing:1px;width:100%}
.p{background:#00e0ff;color:#000}
.g{background:#00ff88;color:#001a0d}
.r{background:#ff3860;color:#fff}
.ptt{padding:40px;border-radius:50%;width:140px;height:140px;margin:16px auto;background:#1a1a22;border:3px solid #2a2a35;color:#888;font-size:.9rem;font-weight:900;letter-spacing:3px}
.ptt.on{background:#5a1a3a;border-color:#ff2d95;color:#fff;box-shadow:0 0 40px #ff2d95}
.bar{text-align:center;padding:10px;background:#14141c;border-radius:8px;font-size:.75rem;color:#5a6580}
.h{display:none!important}
.row{display:flex;gap:6px}
.row button{flex:1;font-size:.75rem;padding:10px}
#ts{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-100px);background:#1a1a22;border:1px solid #252532;padding:10px 16px;border-radius:10px;font-size:.78rem;transition:.3s;pointer-events:none;z-index:999}
#ts.on{transform:translateX(-50%) translateY(0)}
audio{display:none}
</style></head><body>
<div id=ts></div>
<audio id=ra autoplay playsinline></audio>
<div class=w>
<h1>WALKIE</h1>
<div class=bar id=bar>CONNECTING...</div>
<div id=rs>
<input type=tel id=mn placeholder="08..." inputmode=numeric>
<button class=p id=rb onclick=R() style=margin-top:8px>Mulai</button>
</div>
<div id=cs class=h>
<div class=bar id=idv>----</div>
<button class=ptt id=pb disabled ontouchstart="ST(event)" ontouchend="SP(event)" ontouchcancel="SP(event)" onmousedown="ST(event)" onmouseup="SP(event)">PTT</button>
<input type=tel id=tn placeholder="nomor tujuan" inputmode=numeric>
<button class=g onclick=C()>Panggil</button>
<div class=row>
<button class=r onclick=E()>Akhiri</button>
<button class=r onclick=L()>Keluar</button>
</div>
</div>
</div>
<div id=n style="position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:24px" onclick="event.stopPropagation()">
<div style="background:#1a1a22;border:1px solid #ffb300;border-radius:16px;padding:24px;text-align:center;max-width:300px">
<p style="color:#ffb300;margin-bottom:14px">📞 Panggilan masuk</p>
<div id=ci style="color:#00e0ff;font-size:1.2rem;margin-bottom:16px">----</div>
<div class=row>
<button class=g onclick=A()>Terima</button>
<button class=r onclick=X()>Tolak</button>
</div>
</div>
</div>
<script>
'use strict';
var $=function(i){return document.getElementById(i)};
var cl=function(n){return String(n||'').replace(/\D/g,'')};
var lg=function(){console.log.apply(console,['[WT]'].concat([].slice.call(arguments)))};
var tt=null;
function ts(m){var e=$('ts');e.textContent=m;e.className='ts on';clearTimeout(tt);tt=setTimeout(function(){e.className='ts'},2500)}

var ws=null,wr=false,retry=0,pingT=null;
var my=localStorage.getItem('myNo')||'';
var tg='',caller=false;
var pc=null,ls=null,rs=null,pend=[],rds=false;
var po=null,pf=null;
var ra=$('ra');
ra.muted=false;ra.volume=1;

var WU=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';

function setBar(t){$('bar').textContent=t}
function wsConn(){
  lg('ws->',WU);
  setBar('CONNECTING...');
  try{ws=new WebSocket(WU)}catch(e){setBar('LINK ERROR');setTimeout(wsConn,1500);return}
  ws.onopen=function(){
    wr=true;retry=0;
    lg('ws OPEN');
    setBar('ONLINE');
    if(my)wsSend({type:'register',no:my});
    clearInterval(pingT);
    pingT=setInterval(function(){wsSend({type:'ping'})},20000);
  };
  ws.onmessage=function(e){try{om(JSON.parse(e.data))}catch(err){lg('parse',err)}};
  ws.onclose=function(e){
    wr=false;clearInterval(pingT);
    lg('ws CLOSE',e.code);
    setBar('RECONNECT...');
    retry++;
    setTimeout(wsConn,Math.min(800*retry,4000));
  };
  ws.onerror=function(){lg('ws ERR');setBar('LINK ERROR')};
}
function wsSend(o){if(ws&&ws.readyState===1){try{ws.send(JSON.stringify(o))}catch(e){}}}

var lp=null;
function getMic(){
  if(ls)return Promise.resolve(ls);
  if(lp)return lp;
  lp=navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}})
    .then(function(s){
      ls=s;
      s.getAudioTracks().forEach(function(t){t.enabled=false});
      activeTx=s.getAudioTracks()[0];
      lg('MIC OK');
      return s;
    })
    .catch(function(e){lp=null;lg('MIC ERR',e.message);throw e});
  return lp;
}

function om(m){
  var t=m.type;
  if(t==='pong'||t==='welcome')return;
  lg('<-',t);
  if(t==='registered'){
    my=m.no;localStorage.setItem('myNo',m.no);
    $('rs').classList.add('h');
    $('cs').classList.remove('h');
    $('idv').textContent=m.no;
    $('pb').disabled=false;
    ts('✅ '+m.no);
    getMic().catch(function(){});
  }
  else if(t==='error'){ts('❌ '+m.msg);$('rb').textContent='Mulai';$('rb').disabled=false}
  else if(t==='force-logout'){ts('nomor dipakai HP lain');setTimeout(L,1500)}
  else if(t==='incoming-call'){
    po=m.offer;pf=m.from;
    $('ci').textContent=m.from;
    $('n').style.display='flex';
  }
  else if(t==='call-accepted'){onAccepted()}
  else if(t==='call-rejected'){ts('ditolak');cleanup()}
  else if(t==='call-ended'){ts('selesai');cleanup()}
  else if(t==='call-error'){ts(m.msg)}
  else if(t==='answer'){onAnswer(m)}
  else if(t==='ice-candidate'){onIce(m)}
}

function R(){
  var n=cl($('mn').value);
  if(!n)return ts('masukkan nomor');
  if(n.length<8)return ts('min 8 digit');
  if(!/^(0|62)?8\d{7,13}$/.test(n))return ts('format 08xxx');
  my=n;
  localStorage.setItem('myNo',n);
  $('rb').textContent='...';
  $('rb').disabled=true;
  if(wr){wsSend({type:'register',no:n});lg('register sent')}
  else ts('menunggu koneksi...');
}

function C(){
  var t=cl($('tn').value);
  if(!t)return ts('masukkan nomor tujuan');
  if(t===my)return ts('tidak bisa diri sendiri');
  if(!wr)return ts('belum konek');
  tg=t;caller=true;
  ts('memanggil...');
  getMic().then(function(){
    if(!pc)mkPC();
    return pc.createOffer();
  }).then(function(o){
    return pc.setLocalDescription(o);
  }).then(function(){
    wsSend({type:'call-user',to:t,sdp:pc.localDescription});
  }).catch(function(e){ts('gagal: '+e.message)});
}

function A(){
  $('n').style.display='none';
  if(!po)return ts('tidak ada offer');
  tg=pf;caller=false;
  getMic().then(function(){
    if(!pc)mkPC();
    return pc.setRemoteDescription(new RTCSessionDescription(po));
  }).then(function(){rds=true;return flushICE()})
  .then(function(){return pc.createAnswer()})
  .then(function(a){return pc.setLocalDescription(a)})
  .then(function(){
    wsSend({type:'answer',to:tg,sdp:pc.localDescription});
    po=null;
  }).catch(function(e){ts('gagal: '+e.message)});
}

function X(){$('n').style.display='none';if(pf)wsSend({type:'reject-call',to:pf});po=null;pf=null}
function E(){if(tg&&wr)wsSend({type:'end-call',to:tg});cleanup();ts('selesai')}
function L(){try{wsSend({type:'unregister'});E()}catch(e){}localStorage.removeItem('myNo');setTimeout(function(){location.reload()},200)}

function mkPC(){
  if(pc)return pc;
  if(!ls||!ls.getAudioTracks().length){lg('NO TRACK');return null}
  var tr=ls.getAudioTracks()[0];
  pc=new RTCPeerConnection({
    iceServers:[{urls:'stun:stun.l.google.com:19302'}],
    iceCandidatePoolSize:10,bundlePolicy:'max-bundle'
  });
  pc.addTrack(tr,new MediaStream([tr]));
  pc.ontrack=function(e){
    lg('ONTRACK',e.track.kind);
    if(e.streams&&e.streams[0])rs=e.streams[0];
    else{if(!rs)rs=new MediaStream();rs.addTrack(e.track)}
    // === SATU JALUR: <audio> element saja ===
    ra.srcObject=rs;
    ra.muted=false;
    ra.volume=1;
    ra.play().then(function(){lg('play OK')}).catch(function(err){lg('play err',err.message)});
  };
  pc.onicecandidate=function(e){
    if(e.candidate)wsSend({type:'ice-candidate',to:tg,candidate:e.candidate});
  };
  pc.onconnectionstatechange=function(){
    lg('PC',pc.connectionState);
    if(pc.connectionState==='connected'){
      $('pb').disabled=false;
      ts('✅ tersambung');
    }
  };
  return pc;
}

function flushICE(){
  if(!pc||!rds)return Promise.resolve();
  var c=Promise.resolve();
  while(pend.length){(function(ice){c=c.then(function(){return pc.addIceCandidate(ice).catch(function(){})})})(pend.shift())}
  return c;
}

function onAccepted(){
  if(!pc)mkPC();
  pc.createOffer().then(function(o){return pc.setLocalDescription(o)})
    .then(function(){wsSend({type:'offer',to:tg,sdp:pc.localDescription})})
    .catch(function(e){lg('oA err',e.message)});
}

function onAnswer(m){
  if(!pc)return;
  pc.setRemoteDescription(new RTCSessionDescription(m.sdp))
    .then(function(){rds=true;return flushICE()})
    .catch(function(e){lg('ans err',e.message)});
}

function onIce(m){
  if(!pc)return;
  var c=new RTCIceCandidate(m.candidate);
  if(!rds){pend.push(c);return}
  pc.addIceCandidate(c).catch(function(){});
}

function cleanup(){
  try{if(pc)pc.close()}catch(e){}
  pc=null;
  try{if(ls)ls.getTracks().forEach(function(t){t.stop()})}catch(e){}
  ls=null;lp=null;rs=null;
  ra.srcObject=null;
  pend=[];rds=false;
  $('pb').disabled=true;
  $('pb').classList.remove('on');
  po=null;pf=null;
}

// === PTT: mute speaker HP sendiri ===
function ST(e){
  if(e){e.preventDefault()}
  if(!ls)return ts('mic belum siap');
  activeTx=ls.getAudioTracks()[0];
  if(!activeTx)return;
  activeTx.enabled=true;
  ra.volume=0;                    // MUTE speaker → cegah feedback
  $('pb').classList.add('on');
  lg('PTT ON');
}
function SP(e){
  if(e){e.preventDefault()}
  if(!ls)return;
  var t=activeTx||ls.getAudioTracks()[0];
  if(t)t.enabled=false;
  ra.volume=1;                    // UNMUTE speaker
  $('pb').classList.remove('on');
  lg('PTT OFF');
}

function U(){
  ra.muted=false;ra.volume=1;
  ra.play().then(function(){ts('🔊 audio')}).catch(function(){ts('tap lagi')});
}

wsConn();
</script></body></html>

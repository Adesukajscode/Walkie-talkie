<!DOCTYPE html><html lang=id><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name=theme-color content=#0a0e17><title>Walkie Talkie</title><style>
:root{--cy:#00e5ff;--mg:#ff2d95;--lm:#00ff88;--yl:#ffb700;--rd:#ff3860;--tx:#e8ecf5;--mu:#6b7a99;--bg:#0a0e17;--cd:#131a2a;--bd:#1f2a42}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%}
body{font-family:-apple-system,system-ui,'Segoe UI',sans-serif;color:var(--tx);background:var(--bg);padding:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;overscroll-behavior:none}
.wrap{width:100%;max-width:400px;background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:22px;box-shadow:0 8px 32px rgba(0,0,0,.6)}
h1{font-size:1.1rem;font-weight:700;text-align:center;color:var(--cy);margin-bottom:16px;letter-spacing:2px;text-transform:uppercase}
h1::before{content:'◉ ';color:var(--mg)}
.bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;background:rgba(0,0,0,.3);border-radius:8px;font-size:.75rem;color:var(--mu);margin-bottom:16px;letter-spacing:.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rd);flex-shrink:0;transition:.2s}
.dot.on{background:var(--lm);box-shadow:0 0 8px var(--lm)}
.dot.wn{background:var(--yl);box-shadow:0 0 8px var(--yl)}
.ig{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;padding:13px 14px;border-radius:10px;border:1px solid var(--bd);background:rgba(0,0,0,.4);color:var(--tx);font-size:1rem;font-family:inherit;outline:none;transition:.15s;min-width:0}
input::placeholder{color:var(--mu)}
input:focus{border-color:var(--cy);background:rgba(0,0,0,.6);box-shadow:0 0 0 3px rgba(0,229,255,.1)}
input:disabled{opacity:.4}
button{padding:13px 18px;border:none;border-radius:10px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;touch-action:manipulation;letter-spacing:.5px;flex-shrink:0;text-transform:uppercase}
button:disabled{opacity:.35;cursor:not-allowed}
button:not(:disabled):active{transform:scale(.96)}
.p{background:linear-gradient(135deg,#1a7a9e,#00b8d4);color:#fff}
.s{background:linear-gradient(135deg,#00b86b,#00ff88);color:#001a0d}
.d{background:linear-gradient(135deg,#c41e3a,#ff3860);color:#fff}
.w{background:linear-gradient(135deg,#d18f00,#ffb700);color:#241800}
.st{text-align:center;padding:11px;background:rgba(0,0,0,.3);border-radius:10px;font-size:.8rem;color:var(--mu);margin:8px 0;word-break:break-word}
.st.err{color:var(--rd);background:rgba(255,56,96,.1)}
.st.ok{color:var(--lm);background:rgba(0,255,136,.08)}
#ms{color:var(--cy);font-weight:600}
#ol{font-size:.72rem}
.ptt{width:100%;padding:24px;font-size:1rem;font-weight:800;border-radius:60px;margin-top:14px;color:var(--lm);background:rgba(0,255,136,.1);border:2px solid var(--lm);letter-spacing:2px;transition:.15s}
.ptt.on{background:rgba(255,45,149,.15);border-color:var(--mg);color:var(--mg)}
.nf{padding:16px;margin:12px 0;background:rgba(255,183,0,.1);border:1px solid var(--yl);border-radius:12px;text-align:center;display:none}
.nf.on{display:block}
.nf p{margin-bottom:12px;font-size:.9rem;color:var(--yl)}
.nf b{color:var(--cy)}
.nf button{margin:4px 3px 0;min-width:100px}
.h{display:none!important}
.vw{height:8px;background:rgba(0,0,0,.5);border-radius:4px;overflow:hidden;margin:10px 0}
.vu{height:100%;width:0;background:linear-gradient(90deg,var(--lm),var(--cy),var(--mg));transition:width .06s linear}
#ah{font-size:.7rem;color:var(--mu);text-align:center;margin:4px 0 8px;letter-spacing:.5px}
.r{display:flex;gap:8px;margin-top:10px}
.r button{flex:1}
.ts{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-100px);background:#1a2030;border:1px solid var(--bd);padding:12px 18px;border-radius:10px;font-size:.8rem;z-index:999;transition:.3s cubic-bezier(.2,.9,.3,1.4);max-width:90vw;text-align:center;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.ts.on{transform:translateX(-50%) translateY(0)}
.ts.err{border-color:var(--rd);color:var(--rd)}
.ts.ok{border-color:var(--lm);color:var(--lm)}
</style></head><body>
<div class=ts id=ts></div>
<audio id=ra autoplay playsinline></audio>
<div class=wrap>
<h1>Walkie Talkie</h1>
<div class=bar><span class=dot id=dot></span><span id=nt>Menghubungkan...</span></div>
<div id=rs><div class=ig><input type=tel id=mn placeholder="Nomor HP (08...)" inputmode=numeric autocomplete=off maxlength=15><button class=p id=rb onclick=R() disabled>Daftar</button></div></div>
<div id=cs class=h>
<div class=st id=ms>-</div>
<div class=st id=ol>Online: -</div>
<div class=ig><input type=tel id=tn placeholder="Nomor tujuan" inputmode=numeric autocomplete=off maxlength=15><button class=s id=cb onclick=C()>Panggil</button></div>
<div class=vw><div class=vu id=vu></div></div>
<div id=ah>Level suara</div>
<button class=ptt id=pb disabled onclick=M()>🎙 MIC ON</button>
<div class=r><button class=d onclick=E()>Akhiri</button><button class=w onclick=U(1)>🔊 Audio</button></div>
<div class=r><button class=p onclick=L()>Ganti Nomor</button></div>
</div>
<div class=nf id=nf><p>📞 <b id=ci></b> memanggil...</p><button class=s onclick=A()>Terima</button><button class=d onclick=X()>Tolak</button></div>
</div>
<script>
'use strict';
const $=i=>document.getElementById(i),cl=n=>String(n||'').replace(/\D/g,''),lg=(...a)=>console.log('[WT]',...a);
let tt=null;const ts=(m,t='')=>{const e=$('ts');e.textContent=m;e.className='ts on '+t;clearTimeout(tt);tt=setTimeout(()=>e.className='ts '+t,3000)};
const WS_URL=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
let ws=null,wsReady=false,retry=0,pingT=null;
let my=localStorage.getItem('myNo')||'',tg='',caller=0,pc=null,ls=null,rst=null,pend=[],rds=0,mo=0,raf=null,rp=0,rt=null,micMuted=false;
const ra=$('ra');ra.volume=1;ra.muted=false;
const net=(s,t)=>{$('dot').className='dot'+(s==='ok'?' on':(s==='w'?' wn':''));$('nt').textContent=t;$('rb').disabled=s!=='ok';$('cb').disabled=s!=='ok'};
function rbReset(){$('rb').textContent='Daftar';$('rb').disabled=0;$('mn').disabled=0}
fetch('/prewarm').catch(()=>{});

// ==== MIC dengan ECHO CANCELLATION ketat ====
async function gm(){
  if(ls)return ls;
  if(!navigator.mediaDevices)throw Error('Browser tidak dukung mic');
  ls=await navigator.mediaDevices.getUserMedia({
    audio:{
      echoCancellation:true,
      noiseSuppression:true,
      autoGainControl:true,
      channelCount:1,
      sampleRate:48000,
      sampleSize:16
    },
    video:false
  });
  const t=ls.getAudioTracks()[0];
  const s=t.getSettings();
  lg('MIC label=',t.label,'EC=',s.echoCancellation,'NS=',s.noiseSuppression,'AGC=',s.autoGainControl);
  return ls;
}
(async()=>{try{await gm()}catch(e){lg('pre-mic butuh gesture')}})();
document.addEventListener('touchstart',async()=>{if(ra.paused)ra.play().catch(()=>{});if(!ls){try{await gm()}catch(e){}}},{once:true,passive:true});
document.addEventListener('click',async()=>{if(ra.paused)ra.play().catch(()=>{});if(!ls){try{await gm()}catch(e){}}},{once:true});

function cp(){
  if(pc)return pc;
  lg('create PC');
  pc=new RTCPeerConnection({
    iceServers:[{urls:'stun:stun.cloudflare.com:3478'},{urls:'stun:stun.l.google.com:19302'}],
    iceCandidatePoolSize:10,
    bundlePolicy:'max-bundle',
    rtcpMuxPolicy:'require'
  });
  ls.getTracks().forEach(t=>pc.addTrack(t,ls));
  // Opus low-latency + stereo=0 (mono) + DTX (kurangi bandwidth saat diam)
  try{
    const caps=RTCRtpSender.getCapabilities('audio');
    if(caps&&caps.codecs){
      const opus=caps.codecs.filter(c=>c.mimeType.toLowerCase()==='audio/opus');
      const rest=caps.codecs.filter(c=>c.mimeType.toLowerCase()!=='audio/opus');
      pc.getTransceivers().forEach(tr=>{if(tr.setCodecPreferences)tr.setCodecPreferences([...opus,...rest])});
    }
  }catch(e){}
  pc.ontrack=e=>{
    lg('ontrack',e.track.kind,'enabled=',e.track.enabled);
    if(e.streams&&e.streams[0])rst=e.streams[0];
    else{if(!rst)rst=new MediaStream();rst.addTrack(e.track)}
    // HANYA pakai <audio> element (TIDAK pakai AudioContext playback → cegah echo/double)
    ra.srcObject=rst;
    ra.muted=false;
    ra.volume=1;
    const play=()=>ra.play().then(()=>{$('ah').textContent='🎧 Mendengarkan';lg('audio OK')}).catch(err=>{lg('play fail',err.message);$('ah').textContent='⚠️ Tap layar / tombol Audio';try{ra.muted=true;ra.play().then(()=>{ra.muted=false})}catch(_){}});
    play();setTimeout(play,400);setTimeout(play,1200);
    // VU meter terpisah (tidak ikut playback)
    mt(rst);
    e.track.onunmute=()=>lg('remote UNMUTED');
    e.track.onmute=()=>lg('remote MUTED');
  };
  pc.onicecandidate=e=>{if(e.candidate)wsSend({type:'ice-candidate',to:tg,candidate:e.candidate})};
  pc.oniceconnectionstatechange=()=>lg('ICE:',pc.iceConnectionState);
  pc.onconnectionstatechange=()=>{
    lg('PC:',pc.connectionState);
    if(pc.connectionState==='connected'){
      $('ms').textContent='LIVE: '+tg;$('ms').className='st ok';
      $('pb').disabled=false;
      $('pb').textContent=micMuted?'🔇 MIC OFF':'🎙 MIC ON';
      ts('✅ Tersambung','ok');
    } else if(pc.connectionState==='failed'){$('ms').textContent='Koneksi gagal';try{pc.restartIce()}catch(_){}}
    else if(pc.connectionState==='disconnected')$('ms').textContent='Terputus sementara';
  };
  return pc;
}
function prewarmPC(){if(ls&&!pc){cp();lg('PC pre-warmed')}}
async function fc(){if(!pc||!rds)return;while(pend.length){const c=pend.shift();try{await pc.addIceCandidate(c)}catch(e){}}}

// ==== VU meter via AudioContext (read-only, tidak ke speaker) ====
let ac=null,an=null;
function mt(s){
  try{
    if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch{return}}
    if(ac.state==='suspended')ac.resume().catch(()=>{});
    if(!an){an=ac.createAnalyser();an.fftSize=256}
    const src=ac.createMediaStreamSource(s);
    src.connect(an); // TIDAK connect ke destination → tidak ada double audio
  }catch(e){return}
  const d=new Uint8Array(an.frequencyBinCount);cancelAnimationFrame(raf);
  const tk=()=>{an.getByteFrequencyData(d);let x=0;for(let i=0;i<d.length;i++)x+=d[i];$('vu').style.width=Math.min(100,x/d.length*2.5)+'%';raf=requestAnimationFrame(tk)};tk();
}

// ==== WebSocket ====
function wsConn(){
  lg('WS ->',WS_URL);net('w','Menghubungkan...');
  try{ws=new WebSocket(WS_URL)}catch(e){net('','LINK ERROR');setTimeout(wsConn,1500);return}
  ws.onopen=()=>{
    wsReady=true;retry=0;lg('ws OPEN');net('ok','Online');
    if(my){wsSend({type:'register',no:my});rp=1;clearTimeout(rt);rt=setTimeout(()=>{if(rp){ts('Timeout','err');rp=0;rbReset()}},8e3)}
    clearInterval(pingT);pingT=setInterval(()=>wsSend({type:'ping'}),20000);
  };
  ws.onmessage=e=>{try{onMsg(JSON.parse(e.data))}catch(err){lg('parse',err)}};
  ws.onclose=ev=>{wsReady=false;clearInterval(pingT);lg('ws CLOSED',ev.code);net('w','Menyambung ulang...');retry++;setTimeout(wsConn,Math.min(800*retry,4000))};
  ws.onerror=()=>{lg('ws ERROR');net('','LINK ERROR')};
}
function wsSend(o){if(ws&&ws.readyState===1){try{ws.send(JSON.stringify(o))}catch(e){}}else lg('ws not ready',o.type)}
function onMsg(m){
  const t=m.type;
  if(t==='pong'||t==='welcome')return;
  lg('<-',t);
  if(t==='registered'){
    rp=0;clearTimeout(rt);
    my=m.no;localStorage.setItem('myNo',m.no);
    $('rs').classList.add('h');$('cs').classList.remove('h');
    $('ms').textContent='ID: '+m.no;$('ms').className='st ok';
    rbReset();ts('✅ '+m.no,'ok');prewarmPC();
  }
  else if(t==='error'){rp=0;clearTimeout(rt);rbReset();ts('❌ '+m.msg,'err')}
  else if(t==='online'){$('ol').textContent='Online: '+(m.list.join(', ')||'-')}
  else if(t==='force-logout'){ts('Nomor dipakai di HP lain','err');setTimeout(L,1500)}
  else if(t==='incoming-call'){ra.play().catch(()=>{});$('ci').textContent=m.from;$('nf').classList.add('on');navigator.vibrate&&navigator.vibrate([200,100,200])}
  else if(t==='call-accepted'){onAcc()}
  else if(t==='call-rejected'){$('ms').textContent='Ditolak';cl_()}
  else if(t==='call-ended'){$('ms').textContent='Selesai';cl_()}
  else if(t==='call-error'){ts(m.msg,'err');$('ms').textContent=m.msg;$('ms').className='st err'}
  else if(t==='offer'){onOffer(m)}
  else if(t==='answer'){onAnswer(m)}
  else if(t==='ice-candidate'){onIce(m)}
}
async function onAcc(){
  try{
    if(!ls)await gm();
    if(!pc)cp();
    $('ms').textContent='Menyambung...';
    mo=1;const o=await pc.createOffer();await pc.setLocalDescription(o);
    wsSend({type:'offer',to:tg,sdp:pc.localDescription});mo=0;
  }catch(e){lg('cstart',e);ts('Gagal: '+e.message,'err')}
}
async function onOffer(m){
  try{
    if(!ls)await gm();
    if(!pc)cp();
    const col=mo||pc.signalingState!=='stable';
    if(col&&!caller)return;
    await pc.setRemoteDescription(new RTCSessionDescription(m.sdp));
    rds=1;await fc();
    const a=await pc.createAnswer();await pc.setLocalDescription(a);
    wsSend({type:'answer',to:m.from||tg,sdp:pc.localDescription});
  }catch(e){lg('off',e)}
}
async function onAnswer(m){
  try{
    if(!pc)return;
    await pc.setRemoteDescription(new RTCSessionDescription(m.sdp));
    rds=1;await fc();
  }catch(e){lg('ans',e)}
}
async function onIce(m){
  if(!pc)return;const c=new RTCIceCandidate(m.candidate);
  if(!rds){pend.push(c);return}
  try{await pc.addIceCandidate(c)}catch(e){}
}
function U(a){ra.muted=false;ra.volume=1;ra.play().then(()=>{if(a)ts('🔊 Audio aktif','ok')}).catch(e=>{if(a)ts('⚠️ Tap lagi','err')})}
function R(){
  const n=cl($('mn').value);
  if(!n)return ts('Masukkan nomor','err');
  if(n.length<8)return ts('Nomor kurang dari 8 digit','err');
  if(n.length>15)return ts('Nomor terlalu panjang','err');
  if(!/^(0|62)?8\d{7,13}$/.test(n))return ts('Format harus 08xxx','err');
  if(!wsReady)return ts('Belum konek','err');
  my=n;localStorage.setItem('myNo',n);rp=1;
  wsSend({type:'register',no:n});
  $('rb').textContent='...';$('rb').disabled=1;$('mn').disabled=1;
  clearTimeout(rt);rt=setTimeout(()=>{if(rp){ts('Timeout','err');rp=0;rbReset()}},8e3);
}
function L(){try{wsSend({type:'unregister'});E()}catch(_){}localStorage.removeItem('myNo');setTimeout(()=>location.reload(),200)}
function C(){
  tg=cl($('tn').value);
  if(!tg)return ts('Masukkan nomor tujuan','err');
  if(tg===my)return ts('Tidak bisa panggil sendiri','err');
  if(!wsReady)return ts('Belum konek','err');
  caller=1;
  wsSend({type:'call-user',to:tg});
  $('ms').textContent='Memanggil '+tg+'...';$('ms').className='st';
  if(!ls)gm().then(()=>prewarmPC()).catch(()=>{});
}
async function A(){
  $('nf').classList.remove('on');
  tg=$('ci').textContent;caller=0;
  $('ms').textContent='Menyiapkan...';
  try{
    if(!ls)await gm();
    if(!pc)cp();
    wsSend({type:'accept-call',to:tg});
    $('ms').textContent='Menunggu...';
  }catch(e){ts('Mic gagal: '+e.message,'err')}
}
function X(){$('nf').classList.remove('on');wsSend({type:'reject-call',to:$('ci').textContent})}
function E(){if(tg&&wsReady)wsSend({type:'end-call',to:tg});cl_();$('ms').textContent='Selesai';$('ms').className='st'}
function cl_(){
  try{pc&&pc.close()}catch(_){}pc=null;
  try{ls&&ls.getTracks().forEach(t=>t.stop())}catch(_){}ls=null;
  rst=null;ra.srcObject=null;
  pend=[];rds=0;cancelAnimationFrame(raf);$('vu').style.width='0';
  micMuted=false;$('pb').disabled=true;$('pb').classList.remove('on');$('pb').textContent='🎙 MIC ON';
}
function M(){
  if(!ls)return;
  micMuted=!micMuted;
  ls.getAudioTracks().forEach(t=>t.enabled=!micMuted);
  $('pb').classList.toggle('on',micMuted);
  $('pb').textContent=micMuted?'🔇 MIC OFF':'🎙 MIC ON';
  if(navigator.vibrate)navigator.vibrate(20);
  lg('mic',micMuted?'MUTED':'ON');
}
wsConn();
</script></body></html>

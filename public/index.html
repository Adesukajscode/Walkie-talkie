<!DOCTYPE html><html lang=id><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name=theme-color content=#0a0a0f><title>Walkie</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%}
body{font-family:-apple-system,system-ui,sans-serif;background:radial-gradient(ellipse at 50% 10%,#1a1a28,#0a0a0f 70%);color:#eaf0ff;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:16px}
.w{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px}
.ht{padding-top:90px;position:relative}
.ant{position:absolute;top:0;left:50%;transform:translateX(-50%);width:10px;height:90px;display:flex;flex-direction:column;align-items:center;z-index:2}
.ant .s1{flex:1;width:100%;background:linear-gradient(180deg,#4a4a58,#2a2a35);border-radius:3px;box-shadow:inset -2px 0 3px rgba(0,0,0,.5)}
.ant .s2{flex:.8;width:80%;background:linear-gradient(180deg,#3a3a48,#1e1e28);border-radius:3px;margin-top:2px;box-shadow:inset -2px 0 3px rgba(0,0,0,.5)}
.ant .s3{flex:.6;width:60%;background:linear-gradient(180deg,#2a2a35,#0d0d12);border-radius:3px;margin-top:2px}
.ant .tip{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a4a58,#0a0a0f);margin-top:-2px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px;margin-bottom:-6px;position:relative;z-index:3}
.knob{width:30px;height:24px;background:linear-gradient(180deg,#3a3a48,#15151c);border-radius:6px 6px 3px 3px;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.knob::after{content:'';position:absolute;top:50%;left:50%;width:2px;height:8px;background:#5a5a68;transform:translate(-50%,-50%);border-radius:1px}
.knob::before{content:'';position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:22px;height:4px;background:#0a0a0f;border-radius:2px}
.led{width:11px;height:11px;border-radius:50%;background:#3a1010;margin-bottom:8px;transition:.2s;box-shadow:0 0 0 2px #0a0a0f}
.led.on{background:#00ff88;box-shadow:0 0 14px #00ff88,0 0 0 2px #0a0a0f}
.led.w{background:#ffb300;box-shadow:0 0 14px #ffb300,0 0 0 2px #0a0a0f}
.led.tx{background:#ff2d95;box-shadow:0 0 18px #ff2d95,0 0 0 2px #0a0a0f;animation:bl .35s infinite}
.led.rx{background:#0aff8a;box-shadow:0 0 22px #0aff8a,0 0 0 2px #0a0a0f}
@keyframes bl{50%{opacity:.4}}
</style>
<style>
.body{background:linear-gradient(180deg,#252530,#12121a 60%,#0a0a10);border-radius:14px 14px 22px 22px;padding:14px 12px 16px;position:relative;box-shadow:inset 0 2px 0 rgba(255,255,255,.1),inset 0 -4px 8px rgba(0,0,0,.6),0 20px 40px rgba(0,0,0,.6)}
.body::before{content:'';position:absolute;inset:6px;border-radius:10px 10px 18px 18px;border:1px solid rgba(255,255,255,.04);pointer-events:none}
.lcd{background:linear-gradient(180deg,#0d2418,#061410);border:1px solid #1a3020;border-radius:6px;padding:9px 11px;font-family:ui-monospace,'Courier New',monospace;color:#00ff88;text-shadow:0 0 6px rgba(0,255,136,.8);margin-bottom:10px;position:relative;overflow:hidden;min-height:78px;box-shadow:inset 0 2px 6px rgba(0,0,0,.8)}
.lcd::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,255,136,.06) 0 1px,transparent 1px 3px);pointer-events:none}
.lcd .r1{font-size:.58rem;letter-spacing:2.5px;text-transform:uppercase;opacity:.8;margin-bottom:3px}
.lcd .r2{font-size:1.1rem;letter-spacing:2px;font-weight:700;margin-bottom:6px}
.lcd .r3{display:flex;justify-content:space-between;font-size:.6rem;opacity:.9}
.grille{height:38px;margin:8px 30px;background:radial-gradient(circle,rgba(255,255,255,.18) 1.2px,transparent 1.5px) 0 0/7px 7px;border-radius:5px;position:relative;opacity:.5;border:1px solid rgba(0,0,0,.5);box-shadow:inset 0 2px 4px rgba(0,0,0,.7)}
.pttwrap{display:flex;justify-content:center;padding:4px 0}
.ptt{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#4a4a58,#1e1e28 55%,#0a0a10);border:2px solid #2a2a35;color:#7a7a88;font-family:inherit;font-size:.68rem;font-weight:900;letter-spacing:5px;text-transform:uppercase;padding:0;cursor:pointer;touch-action:none;-webkit-touch-callout:none;position:relative;box-shadow:inset 0 4px 0 rgba(255,255,255,.1),inset 0 -8px 14px rgba(0,0,0,.75),0 8px 18px rgba(0,0,0,.6),0 0 0 4px #0a0a10;transition:.15s}
.ptt::before{content:'';position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.06),transparent 60%);pointer-events:none}
.ptt:disabled{opacity:.4}
.ptt.on{border-color:#ff2d95;color:#fff;background:radial-gradient(circle at 38% 32%,#6a1a4a,#2a0a1f 55%,#0a0a10);box-shadow:inset 0 4px 0 rgba(255,45,149,.3),0 8px 24px rgba(255,45,149,.4),0 0 0 4px #0a0a10,0 0 40px rgba(255,45,149,.6);transform:scale(.97)}
.ptt.on::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(255,45,149,.7);animation:ping 1.2s ease-out infinite;pointer-events:none}
@keyframes ping{0%{inset:-4px;opacity:1}100%{inset:-26px;opacity:0}}
.keys{display:flex;justify-content:center;gap:6px;margin-top:8px}
.k{padding:8px 6px;border:1px solid #2a2a35;background:linear-gradient(180deg,#2a2a35,#15151c);border-radius:6px;color:#8a8a98;font-size:.58rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;font-family:inherit;flex:1}
.k:active{background:#00e0ff;color:#000;border-color:#00e0ff}
.panel{display:flex;gap:6px;width:100%}
.panel input{flex:1;padding:12px 13px;border-radius:11px;border:1px solid #252532;background:#14141c;color:#fff;font-size:.9rem;outline:none;min-width:0;font-family:inherit}
.panel input::placeholder{color:#5a6580}
.panel input:focus{border-color:#00e0ff}
.panel button{padding:12px 16px;border:none;border-radius:11px;font-size:.75rem;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:1px;text-transform:uppercase;flex-shrink:0}
.b1{background:#00e0ff;color:#000}
.b2{background:#00ff88;color:#001a0d}
.h{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:200;padding:24px}
.modal.on{display:flex}
.mcard{background:linear-gradient(180deg,#1e1e28,#0d0d12);border:1px solid #ffb300;border-radius:18px;padding:22px;text-align:center;max-width:320px;width:100%}
.mcard p{color:#ffb300;font-size:.8rem;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px}
.mcard b{color:#00e0ff;display:block;font-size:1.15rem;margin-top:6px;font-family:monospace;letter-spacing:2px;margin-bottom:14px}
.mcard .row{display:flex;gap:8px}
.mcard .row button{flex:1;padding:13px;border-radius:11px;border:none;font-weight:800;font-size:.8rem;letter-spacing:1px;text-transform:uppercase;cursor:pointer;font-family:inherit}
.yes{background:#00ff88;color:#001a0d}
.no{background:transparent;border:1px solid #252532;color:#7d8ab0}
#ts{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);background:#14141c;border:1px solid #252532;padding:11px 18px;border-radius:10px;font-size:.75rem;z-index:999;transition:.35s;max-width:90vw;text-align:center;pointer-events:none}
#ts.on{transform:translateX(-50%) translateY(0)}
#ts.e{border-color:#ff3860;color:#ff3860}
#ts.k{border-color:#00ff88;color:#00ff88}
audio{display:none}
</style></head>
<body>
<div id=ts></div>
<audio id=ra autoplay playsinline></audio>
<div class=w>
<div class=ht>
<div class=ant><div class=s1></div><div class=s2></div><div class=s3></div><div class=tip></div></div>
<div class=topbar><div class=knob></div><div class=led id=led></div><div class=knob></div></div>
<div class=body>
<div class=lcd>
<div class=r1 id=st>CONNECTING</div>
<div class=r2 id=idv>----</div>
<div class=r3><span id=dv>--</span><span id=fv>--</span></div>
</div>
<div class=grille></div>
<div class=pttwrap><button class=ptt id=pb disabled>PTT</button></div>
<div class=keys>
<button class=k onclick="window.M()">MATCH</button>
<button class=k onclick="window.E()">AKHIRI</button>
<button class=k onclick="window.U()">AUDIO</button>
</div>
</div>
</div>
<div id=f1 class=panel><input id=mn type=tel placeholder="08..." inputmode=numeric maxlength=15><button class=b1 onclick="window.R()">MULAI</button></div>
<div id=f2 class="panel h"><input id=tn type=tel placeholder="nomor tujuan" inputmode=numeric maxlength=15><button class=b2 onclick="window.C()">PANGGIL</button></div>
<div id=f2b class="panel h"><button class=k style="flex:1" onclick="window.L()">KELUAR</button></div>
</div>
<div class=modal id=modal><div class=mcard><p>📞 Panggilan masuk</p><b id=ci>----</b><div class=row><button class=yes onclick="window.A()">Terima</button><button class=no onclick="window.X()">Tolak</button></div></div></div>
<script>
'use strict';

// Kill old SW
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){});
  if(window.caches)caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})}).catch(function(){});
}

var $=function(i){return document.getElementById(i)};
var cl=function(n){return String(n||'').replace(/\D/g,'')};
var lg=function(){console.log.apply(console,['[W]'].concat([].slice.call(arguments)))};
var ttm=null;
function ts(m,c){var e=$('ts');if(!e)return;e.textContent=m;e.className=(c?'on '+c:'on');clearTimeout(ttm);ttm=setTimeout(function(){e.className=(c||'')},3000)}
function setSt(t,c){var e=$('st');if(e)e.textContent=t;var l=$('led');if(l)l.className='led'+(c?' '+c:'')}

var ws=null,wr=false,retry=0,pingT=null;
var my=localStorage.getItem('myNo')||'';
var tg='',caller=false,matching=false;
var pc=null,ls=null,rs=null,pend=[],rds=false;
var po=null,pf=null;
var ra=$('ra');
var ac=null,an=null,raf=null;
var rttT=null;
var WU=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';

// ==== AUDIO UNLOCK (kritis) ====
ra.muted=false;ra.volume=1;
function unlockAudio(){
  try{
    ra.muted=false;
    if(ra.volume<0.01)ra.volume=1;
    var p=ra.play();
    if(p&&p.then)p.then(function(){lg('audio unlocked')}).catch(function(e){lg('unlock fail',e.message)});
    if(ac&&ac.state==='suspended')ac.resume().catch(function(){});
  }catch(e){}
}
document.addEventListener('touchstart',unlockAudio,{passive:true});
document.addEventListener('touchend',unlockAudio,{passive:true});
document.addEventListener('click',unlockAudio);
document.addEventListener('pointerdown',unlockAudio);

function wsConn(){
  lg('ws->',WU);
  setSt('CONNECTING','w');
  try{ws=new WebSocket(WU)}catch(e){setSt('ERR');setTimeout(wsConn,2000);return}
  ws.onopen=function(){
    wr=true;retry=0;lg('ws OPEN');
    setSt('ONLINE','on');
    if(my){wsSend({type:'register',no:my});lg('auto-reg',my)}
    clearInterval(pingT);pingT=setInterval(function(){wsSend({type:'ping'})},20000);
  };
  ws.onmessage=function(e){try{om(JSON.parse(e.data))}catch(err){lg('parse',err.message)}};
  ws.onclose=function(e){
    wr=false;clearInterval(pingT);lg('ws CLOSE',e.code);
    setSt('RECONNECT','w');retry++;
    setTimeout(wsConn,Math.min(1000*retry,5000));
  };
  ws.onerror=function(){lg('ws ERR');setSt('ERR')};
}
function wsSend(o){if(ws&&ws.readyState===1){try{ws.send(JSON.stringify(o))}catch(e){}}else lg('ws not ready',o.type)}

var lp=null;
function getMic(){
  if(ls)return Promise.resolve(ls);
  if(lp)return lp;
  if(!navigator.mediaDevices)return Promise.reject(new Error('no mic'));
  lp=navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false})
    .then(function(s){ls=s;s.getAudioTracks().forEach(function(t){t.enabled=false});lg('mic OK');return s})
    .catch(function(e){lp=null;lg('mic err',e.message);throw e});
  return lp;
}
getMic().catch(function(){});

function om(m){
  var t=m.type;
  if(t==='pong'||t==='welcome')return;
  lg('<-',t);
  if(t==='registered'){
    my=m.no;localStorage.setItem('myNo',m.no);
    $('f1').classList.add('h');$('f2').classList.remove('h');$('f2b').classList.remove('h');
    $('idv').textContent=m.no;
    ts('OK '+m.no,'k');
    getMic().catch(function(){});
    unlockAudio();
  }
  else if(t==='error'){ts('ERR '+m.msg,'e');matching=false}
  else if(t==='online'){lg('online:',(m.list||[]).join(','))}
  else if(t==='match-found'){matching=false;ts('match '+m.no,'k');tg=m.no;caller=true;doCall()}
  else if(t==='incoming'){
    po=m.sdp;pf=m.from;
    $('ci').textContent=m.from;
    $('modal').classList.add('on');
    unlockAudio();
    if(navigator.vibrate)try{navigator.vibrate([200,100,200])}catch(_){}
  }
  else if(t==='accepted'){onAccepted()}
  else if(t==='rejected'){ts('ditolak','e');cleanup()}
  else if(t==='ended'){ts('selesai');cleanup()}
  else if(t==='sdp'){onSdp(m)}
  else if(t==='ice'){onIce(m)}
}

window.R=function(){
  var n=cl($('mn').value);
  if(!n)return ts('masukkan nomor','e');
  if(n.length<8)return ts('min 8 digit','e');
  if(!/^(0|62)?8\d{7,13}$/.test(n))return ts('format 08xxx','e');
  my=n;localStorage.setItem('myNo',n);
  if(wr)wsSend({type:'register',no:n});
  else ts('menunggu koneksi...','e');
};
window.M=function(){
  if(!wr)return ts('belum konek','e');
  if(matching)return;
  matching=true;ts('mencari...','k');
  wsSend({type:'match'});
  setTimeout(function(){if(matching){matching=false;ts('tidak ada user lain','e')}},10000);
};
window.C=function(){
  var t=cl($('tn').value);
  if(!t)return ts('nomor kosong','e');
  if(t===my)return ts('tidak bisa diri sendiri','e');
  if(!wr)return ts('belum konek','e');
  tg=t;caller=true;doCall();
};
window.A=function(){
  $('modal').classList.remove('on');
  if(!po)return;
  tg=pf;caller=false;ts('menyambung...','k');
  getMic().then(function(){if(!pc)mkPC();return pc.setRemoteDescription(new RTCSessionDescription(po))})
    .then(function(){rds=true;return flushICE()})
    .then(function(){return pc.createAnswer()})
    .then(function(a){return pc.setLocalDescription(a)})
    .then(function(){wsSend({type:'accept',to:tg});wsSend({type:'sdp',to:tg,sdp:pc.localDescription});po=null;unlockAudio()})
    .catch(function(e){ts('gagal '+e.message,'e');lg('acc',e.message)});
};
window.X=function(){$('modal').classList.remove('on');if(pf)wsSend({type:'reject',to:pf});po=null;pf=null};
window.E=function(){if(tg&&wr)wsSend({type:'end',to:tg});cleanup();ts('selesai')};
window.L=function(){try{wsSend({type:'end',to:tg})}catch(e){}localStorage.removeItem('myNo');location.reload()};
window.U=function(){unlockAudio();ts('audio aktif','k')};

window.ST=function(e){
  if(e){e.preventDefault();if(e.stopPropagation)e.stopPropagation()}
  try{
    unlockAudio();
    if(!ls||!ls.getAudioTracks)return ts('mic belum siap','e');
    var t=ls.getAudioTracks()[0];
    if(t)t.enabled=true;
    ra.volume=0;
    var pb=$('pb');if(pb)pb.classList.add('on');
    var l=$('led');if(l){l.classList.add('tx');l.classList.remove('rx')}
    if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}
    lg('PTT ON');
  }catch(err){lg('ST err',err.message)}
};
window.SP=function(e){
  if(e){e.preventDefault();if(e.stopPropagation)e.stopPropagation()}
  try{
    if(ls&&ls.getAudioTracks)ls.getAudioTracks().forEach(function(t){t.enabled=false});
    ra.volume=1;
    unlockAudio();
    var pb=$('pb');if(pb)pb.classList.remove('on');
    var l=$('led');if(l)l.classList.remove('tx');
    lg('PTT OFF');
  }catch(err){lg('SP err',err.message)}
};

function mkPC(){
  if(pc)return pc;
  if(!ls||!ls.getAudioTracks().length){lg('NO TRACK');return null}
  var tr=ls.getAudioTracks()[0];
  pc=new RTCPeerConnection({
    iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}],
    iceCandidatePoolSize:10,bundlePolicy:'max-bundle'
  });
  pc.addTrack(tr,new MediaStream([tr]));
  pc.ontrack=function(e){
    lg('ONTRACK',e.track.kind);
    if(e.streams&&e.streams[0])rs=e.streams[0];
    else{if(!rs)rs=new MediaStream();rs.addTrack(e.track)}
    ra.srcObject=rs;ra.muted=false;ra.volume=1;
    var tries=0;
    function tryPlay(){
      tries++;
      var p=ra.play();
      if(p&&p.then){
        p.then(function(){lg('play OK try'+tries);setSt('LIVE','on')})
        .catch(function(err){lg('play fail'+tries,err.message);if(tries<5)setTimeout(tryPlay,300)});
      }else setSt('LIVE','on');
    }
    tryPlay();
    startVU(rs);
    e.track.onunmute=function(){lg('RX unmute');var l=$('led');if(l&&!l.classList.contains('tx'))l.classList.add('rx')};
    e.track.onmute=function(){var l=$('led');if(l)l.classList.remove('rx')};
  };
  pc.onicecandidate=function(e){if(e.candidate)wsSend({type:'ice',to:tg,ice:e.candidate})};
  pc.onconnectionstatechange=function(){
    lg('PC',pc.connectionState);
    if(pc.connectionState==='connected'){
      $('pb').disabled=false;
      ts('LIVE','k');
      applyLowLatency();
      setTimeout(applyLowLatency,500);
      setTimeout(applyLowLatency,1500);
      startRTT();
    }
  };
  return pc;
}
function applyLowLatency(){
  if(!pc)return;
  try{[].concat(pc.getSenders(),pc.getReceivers()).forEach(function(x){
    try{if('playoutDelayHint'in x)x.playoutDelayHint=0}catch(e){}
    try{if('jitterBufferTarget'in x)x.jitterBufferTarget=0}catch(e){}
  })}catch(e){}
}
function startRTT(){
  if(rttT)clearInterval(rttT);
  rttT=setInterval(function(){
    if(!pc||pc.connectionState!=='connected')return;
    pc.getStats().then(function(stats){
      var rtt=null;
      stats.forEach(function(r){if(r.type==='candidate-pair'&&r.state==='succeeded'&&r.nominated&&r.currentRoundTripTime!=null)rtt=r.currentRoundTripTime});
      if(rtt&&rtt>0){
        var km=Math.max(0,(rtt/2)*200000-500);
        var dv=$('dv');
        if(dv)dv.textContent='📍 '+(km<1?(km*1000).toFixed(0)+'m':(km<1000?km.toFixed(1)+'km':(km/1000).toFixed(1)+'Mm'));
      }
    }).catch(function(){});
  },2000);
}
function startVU(stream){
  try{
    if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'})}
    if(ac.state==='suspended')ac.resume().catch(function(){});
    if(!an){an=ac.createAnalyser();an.fftSize=256}
    ac.createMediaStreamSource(stream).connect(an);
  }catch(e){return}
  var d=new Uint8Array(an.frequencyBinCount);
  if(raf)cancelAnimationFrame(raf);
  var k=0;
  function tk(){
    an.getByteFrequencyData(d);
    if((k++&3)===0){
      var mv=0,mb=0,i;
      for(i=1;i<d.length;i++){if(d[i]>mv){mv=d[i];mb=i}}
      var hz=mb*ac.sampleRate/an.fftSize;
      var fv=$('fv');
      if(fv)fv.textContent=mv<15?'--':(hz<1000?hz.toFixed(0)+'Hz':(hz/1000).toFixed(1)+'kHz');
      var l=$('led');if(l&&!l.classList.contains('tx'))l.classList.toggle('rx',mv>30);
    }
    raf=requestAnimationFrame(tk);
  }
  tk();
}
function doCall(){
  ts('memanggil '+tg,'k');
  getMic().then(function(){if(!pc)mkPC();return pc.createOffer()})
    .then(function(o){return pc.setLocalDescription(o)})
    .then(function(){wsSend({type:'call',to:tg,sdp:pc.localDescription});lg('offer sent')})
    .catch(function(e){ts('gagal','e');lg('doCall',e.message)});
}
function onAccepted(){
  if(!pc)mkPC();
  pc.createOffer().then(function(o){return pc.setLocalDescription(o)})
    .then(function(){wsSend({type:'sdp',to:tg,sdp:pc.localDescription})})
    .catch(function(e){lg('oA',e.message)});
}
function onSdp(m){
  if(!pc)return;
  var d=new RTCSessionDescription(m.sdp);
  if(d.type==='answer'){
    pc.setRemoteDescription(d).then(function(){rds=true;return flushICE()}).catch(function(e){lg('ans',e.message)});
  }else if(d.type==='offer'){
    pc.setRemoteDescription(d).then(function(){rds=true;return flushICE()})
      .then(function(){return pc.createAnswer()})
      .then(function(a){return pc.setLocalDescription(a)})
      .then(function(){wsSend({type:'sdp',to:m.from,sdp:pc.localDescription})})
      .catch(function(e){lg('off',e.message)});
  }
}
function onIce(m){
  if(!pc)return;
  var c=new RTCIceCandidate(m.ice);
  if(!rds){pend.push(c);return}
  pc.addIceCandidate(c).catch(function(){});
}
function flushICE(){
  if(!pc||!rds)return Promise.resolve();
  var c=Promise.resolve();
  while(pend.length){(function(ice){c=c.then(function(){return pc.addIceCandidate(ice).catch(function(){})})})(pend.shift())}
  return c;
}
function cleanup(){
  try{if(pc)pc.close()}catch(e){}
  pc=null;
  try{if(ls)ls.getTracks().forEach(function(t){t.stop()})}catch(e){}
  ls=null;lp=null;rs=null;
  if(ra)ra.srcObject=null;
  pend=[];rds=false;
  if(rttT){clearInterval(rttT);rttT=null}
  if(raf){cancelAnimationFrame(raf);raf=null}
  var pb=$('pb');if(pb){pb.disabled=true;pb.classList.remove('on')}
  var l=$('led');if(l){l.classList.remove('tx');l.classList.remove('rx')}
  po=null;pf=null;tg='';caller=false;matching=false;
  var dv=$('dv');if(dv)dv.textContent='--';
  var fv=$('fv');if(fv)fv.textContent='--';
}

setTimeout(function(){
  var pb=$('pb');
  if(pb){
    pb.addEventListener('touchstart',window.ST,{passive:false});
    pb.addEventListener('touchend',window.SP,{passive:false});
    pb.addEventListener('touchcancel',window.SP,{passive:false});
    pb.addEventListener('mousedown',window.ST);
    pb.addEventListener('mouseup',window.SP);
    pb.addEventListener('mouseleave',window.SP);
    lg('PTT listeners OK');
  }
},0);

window.addEventListener('error',function(e){lg('ERR',e.message,'@',e.lineno)});
window.addEventListener('online',function(){if(!wr)wsConn()});
wsConn();
lg('init done');

<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Walkie</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:system-ui;background:#0a0a0f;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;font-size:15px}
.w{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px}
h1{text-align:center;color:#00e0ff;font-size:1rem;letter-spacing:3px}
.bar{text-align:center;padding:12px;background:#14141c;border-radius:8px;font-size:.8rem;color:#8a8a98}
.led{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff3860;margin-right:8px;vertical-align:middle}
.led.on{background:#00ff88;box-shadow:0 0 10px #00ff88}
.led.w{background:#ffb300;box-shadow:0 0 10px #ffb300}
input{padding:14px;border-radius:10px;border:1px solid #252532;background:#14141c;color:#fff;font-size:1rem;outline:none;width:100%;font-family:inherit}
input:focus{border-color:#00e0ff}
button{padding:14px;border:none;border-radius:10px;font-weight:800;font-size:.85rem;cursor:pointer;text-transform:uppercase;letter-spacing:1.5px;width:100%;font-family:inherit;transition:.15s}
button:active{transform:scale(.97)}
.p{background:#00e0ff;color:#000}
.g{background:#00ff88;color:#001a0d}
.r{background:#ff3860;color:#fff}
.b{background:#7d8ab0;color:#000}
.row{display:flex;gap:8px}
.row button{flex:1}
.ptt{padding:44px;border-radius:50%;width:150px;height:150px;margin:12px auto;background:#1a1a22;border:3px solid #2a2a35;color:#888;font-size:.9rem;font-weight:900;letter-spacing:3px;width:150px}
.ptt.on{background:#5a1a3a;border-color:#ff2d95;color:#fff;box-shadow:0 0 40px #ff2d95}
.ptt:disabled{opacity:.4}
.h{display:none!important}
#ts{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-120px);background:#1a1a22;border:1px solid #252532;padding:12px 20px;border-radius:10px;font-size:.8rem;transition:.3s;pointer-events:none;z-index:999;max-width:90vw;text-align:center}
#ts.on{transform:translateX(-50%) translateY(0)}
#ts.e{border-color:#ff3860;color:#ff3860}
#ts.k{border-color:#00ff88;color:#00ff88}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:200;padding:24px}
.modal.on{display:flex}
.mcard{background:#1e1e28;border:1px solid #ffb300;border-radius:16px;padding:24px;text-align:center;max-width:320px;width:100%}
.mcard b{color:#00e0ff;display:block;font-size:1.2rem;margin-bottom:16px;font-family:monospace}
audio{display:none}
</style></head><body>
<div id=ts></div>
<audio id=ra autoplay playsinline></audio>
<div class=w>
<h1>WALKIE</h1>
<div class=bar><span class=led id=led></span><span id=st>MEMUAT...</span></div>

<div id=f1>
<input id=mn type=tel placeholder="08..." inputmode=numeric maxlength=15>
<button class=p onclick="window.R()" style="margin-top:8px">MULAI</button>
</div>

<div id=f2 class=h>
<div class=bar id=idv>----</div>
<button class=ptt id=pb disabled>PTT</button>
<input id=tn type=tel placeholder="nomor tujuan" inputmode=numeric maxlength=15>
<div class=row style="margin-top:8px">
<button class=g onclick="window.M()">MATCH</button>
<button class=g onclick="window.C()">PANGGIL</button>
</div>
<div class=row style="margin-top:8px">
<button class=r onclick="window.E()">AKHIRI</button>
<button class=b onclick="window.L()">KELUAR</button>
</div>
</div>

</div>
<div class=modal id=modal><div class=mcard><p style="color:#ffb300;margin-bottom:12px">Panggilan masuk</p><b id=ci>----</b><div class=row><button class=g onclick="window.A()">Terima</button><button class=r onclick="window.X()">Tolak</button></div></div></div>
<script>
'use strict';

// ==== BUNUH SERVICE WORKER LAMA ====
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){
    rs.forEach(function(r){r.unregister();console.log('[W] SW unregistered')});
  }).catch(function(){});
  if(window.caches){
    caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})}).catch(function(){});
  }
}

var $=function(i){return document.getElementById(i)};
var cl=function(n){return String(n||'').replace(/\D/g,'')};
var lg=function(){console.log.apply(console,['[W]'].concat([].slice.call(arguments)))};
var ttm=null;
function ts(m,c){var e=$('ts');if(!e)return;e.textContent=m;e.className=(c?'on '+c:'on');clearTimeout(ttm);ttm=setTimeout(function(){e.className=(c||'')},3000)}
function setSt(t,c){var e=$('st');if(e)e.textContent=t;var l=$('led');if(l)l.className='led'+(c?' '+c:'')}

var ws=null,wr=false,retry=0,pingT=null;
var my=localStorage.getItem('myNo')||'';
var tg='',caller=false;
var pc=null,ls=null,rs=null,pend=[],rds=false;
var po=null,pf=null;
var ra=$('ra');
if(ra){ra.muted=false;ra.volume=1}
var WU=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';

// ==== WEBSOCKET ====
function wsConn(){
  lg('ws->',WU);
  setSt('CONNECTING','w');
  try{ws=new WebSocket(WU)}catch(e){lg('ws create err',e.message);setSt('ERR');setTimeout(wsConn,2000);return}
  ws.onopen=function(){
    wr=true;retry=0;lg('ws OPEN');
    setSt('ONLINE','on');
    if(my){wsSend({type:'register',no:my});lg('auto-reg',my)}
    clearInterval(pingT);pingT=setInterval(function(){wsSend({type:'ping'})},20000);
  };
  ws.onmessage=function(e){try{om(JSON.parse(e.data))}catch(err){lg('parse',err.message)}};
  ws.onclose=function(e){
    wr=false;clearInterval(pingT);lg('ws CLOSE',e.code);
    setSt('RECONNECT','w');retry++;
    setTimeout(wsConn,Math.min(1000*retry,5000));
  };
  ws.onerror=function(){lg('ws ERR');setSt('ERR')};
}
function wsSend(o){if(ws&&ws.readyState===1){try{ws.send(JSON.stringify(o))}catch(e){}}else lg('ws not ready',o.type)}

// ==== MIC ====
var lp=null;
function getMic(){
  if(ls)return Promise.resolve(ls);
  if(lp)return lp;
  if(!navigator.mediaDevices)return Promise.reject(new Error('no mic'));
  lp=navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false})
    .then(function(s){ls=s;s.getAudioTracks().forEach(function(t){t.enabled=false});lg('mic OK');return s})
    .catch(function(e){lp=null;lg('mic err',e.message);throw e});
  return lp;
}
getMic().catch(function(){});

// ==== MESSAGE HANDLER ====
function om(m){
  var t=m.type;
  if(t==='pong'||t==='welcome')return;
  lg('<-',t);
  if(t==='registered'){
    my=m.no;localStorage.setItem('myNo',m.no);
    var f1=$('f1'),f2=$('f2'),idv=$('idv');
    if(f1)f1.classList.add('h');
    if(f2)f2.classList.remove('h');
    if(idv)idv.textContent=m.no;
    ts('OK '+m.no,'k');
    getMic().catch(function(){});
  }
  else if(t==='error'){ts('ERR '+m.msg,'e')}
  else if(t==='online'){lg('online:',(m.list||[]).join(','))}
  else if(t==='match-found'){ts('match '+m.no,'k');tg=m.no;caller=true;doCall()}
  else if(t==='incoming'){
    po=m.sdp;pf=m.from;
    var ci=$('ci');if(ci)ci.textContent=m.from;
    var md=$('modal');if(md)md.classList.add('on');
    if(navigator.vibrate)try{navigator.vibrate([200,100,200])}catch(_){}
  }
  else if(t==='accepted'){onAccepted()}
  else if(t==='rejected'){ts('ditolak','e');cleanup()}
  else if(t==='ended'){ts('selesai');cleanup()}
  else if(t==='sdp'){onSdp(m)}
  else if(t==='ice'){onIce(m)}
}

// ==== ACTIONS (expose ke window) ====
window.R=function(){
  lg('R() called');
  var mn=$('mn');if(!mn)return;
  var n=cl(mn.value);
  if(!n)return ts('masukkan nomor','e');
  if(n.length<8)return ts('min 8 digit','e');
  my=n;localStorage.setItem('myNo',n);
  if(wr){wsSend({type:'register',no:n});ts('mendaftar...','k')}
  else ts('menunggu koneksi...','e');
};

window.M=function(){
  if(!wr)return ts('belum konek','e');
  ts('mencari user online...','k');
  wsSend({type:'match'});
};

window.C=function(){
  var tn=$('tn');if(!tn)return;
  var t=cl(tn.value);
  if(!t)return ts('nomor tujuan kosong','e');
  if(t===my)return ts('tidak bisa diri sendiri','e');
  if(!wr)return ts('belum konek','e');
  tg=t;caller=true;doCall();
};

window.A=function(){
  var md=$('modal');if(md)md.classList.remove('on');
  if(!po)return;
  tg=pf;caller=false;ts('menyambung...','k');
  getMic().then(function(){
    if(!pc)mkPC();
    return pc.setRemoteDescription(new RTCSessionDescription(po));
  }).then(function(){rds=true;return flushICE()})
  .then(function(){return pc.createAnswer()})
  .then(function(a){return pc.setLocalDescription(a)})
  .then(function(){
    wsSend({type:'accept',to:tg});
    wsSend({type:'sdp',to:tg,sdp:pc.localDescription});
    po=null;lg('answer sent');
  }).catch(function(e){ts('gagal '+e.message,'e');lg('acc err',e.message)});
};

window.X=function(){var md=$('modal');if(md)md.classList.remove('on');if(pf)wsSend({type:'reject',to:pf});po=null;pf=null};
window.E=function(){if(tg&&wr)wsSend({type:'end',to:tg});cleanup();ts('selesai')};
window.L=function(){try{wsSend({type:'end',to:tg})}catch(e){}localStorage.removeItem('myNo');location.reload()};

window.ST=function(e){
  if(e){e.preventDefault();if(e.stopPropagation)e.stopPropagation()}
  try{
    if(!ls||!ls.getAudioTracks){ts('mic belum siap','e');return}
    var t=ls.getAudioTracks()[0];
    if(t)t.enabled=true;
    if(ra)ra.volume=0;
    var pb=$('pb');if(pb)pb.classList.add('on');
    if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}
    lg('PTT ON');
  }catch(err){lg('ST err',err.message)}
};
window.SP=function(e){
  if(e){e.preventDefault();if(e.stopPropagation)e.stopPropagation()}
  try{
    if(ls&&ls.getAudioTracks)ls.getAudioTracks().forEach(function(t){t.enabled=false});
    if(ra)ra.volume=1;
    var pb=$('pb');if(pb)pb.classList.remove('on');
    lg('PTT OFF');
  }catch(err){lg('SP err',err.message)}
};

// ==== PEER CONNECTION ====
function mkPC(){
  if(pc)return pc;
  if(!ls||!ls.getAudioTracks().length){lg('NO TRACK');return null}
  var tr=ls.getAudioTracks()[0];
  pc=new RTCPeerConnection({
    iceServers:[{urls:'stun:stun.l.google.com:19302'}],
    iceCandidatePoolSize:10,
    bundlePolicy:'max-bundle'
  });
  pc.addTrack(tr,new MediaStream([tr]));
  pc.ontrack=function(e){
    lg('ONTRACK',e.track.kind);
    if(e.streams&&e.streams[0])rs=e.streams[0];
    else{if(!rs)rs=new MediaStream();rs.addTrack(e.track)}
    if(ra){
      ra.srcObject=rs;
      ra.muted=false;
      ra.volume=1;
      ra.play().then(function(){lg('play OK')}).catch(function(err){lg('play err',err.message)});
    }
  };
  pc.onicecandidate=function(e){if(e.candidate)wsSend({type:'ice',to:tg,ice:e.candidate})};
  pc.onconnectionstatechange=function(){
    lg('PC',pc.connectionState);
    if(pc.connectionState==='connected'){
      var pb=$('pb');if(pb)pb.disabled=false;
      ts('LIVE','k');
    }
  };
  return pc;
}

function doCall(){
  ts('memanggil '+tg,'k');
  getMic().then(function(){if(!pc)mkPC();return pc.createOffer()})
    .then(function(o){return pc.setLocalDescription(o)})
    .then(function(){wsSend({type:'call',to:tg,sdp:pc.localDescription});lg('offer sent')})
    .catch(function(e){ts('gagal','e');lg('doCall err',e.message)});
}

function onAccepted(){
  if(!pc)mkPC();
  pc.createOffer().then(function(o){return pc.setLocalDescription(o)})
    .then(function(){wsSend({type:'sdp',to:tg,sdp:pc.localDescription})})
    .catch(function(e){lg('oA err',e.message)});
}

function onSdp(m){
  if(!pc)return;
  var d=new RTCSessionDescription(m.sdp);
  if(d.type==='answer'){
    pc.setRemoteDescription(d).then(function(){rds=true;return flushICE()}).catch(function(e){lg('ans err',e.message)});
  }else if(d.type==='offer'){
    pc.setRemoteDescription(d).then(function(){rds=true;return flushICE()})
      .then(function(){return pc.createAnswer()})
      .then(function(a){return pc.setLocalDescription(a)})
      .then(function(){wsSend({type:'sdp',to:m.from,sdp:pc.localDescription})})
      .catch(function(e){lg('off err',e.message)});
  }
}

function onIce(m){
  if(!pc)return;
  var c=new RTCIceCandidate(m.ice);
  if(!rds){pend.push(c);return}
  pc.addIceCandidate(c).catch(function(){});
}

function flushICE(){
  if(!pc||!rds)return Promise.resolve();
  var c=Promise.resolve();
  while(pend.length){
    (function(ice){c=c.then(function(){return pc.addIceCandidate(ice).catch(function(){})})})(pend.shift());
  }
  return c;
}

function cleanup(){
  try{if(pc)pc.close()}catch(e){}
  pc=null;
  try{if(ls)ls.getTracks().forEach(function(t){t.stop()})}catch(e){}
  ls=null;lp=null;rs=null;
  if(ra)ra.srcObject=null;
  pend=[];rds=false;
  var pb=$('pb');if(pb){pb.disabled=true;pb.classList.remove('on')}
  po=null;pf=null;
}

// ==== PTT EVENTS (manual listener — biar pasti) ====
setTimeout(function(){
  var pb=$('pb');
  if(pb){
    pb.addEventListener('touchstart',window.ST,{passive:false});
    pb.addEventListener('touchend',window.SP,{passive:false});
    pb.addEventListener('touchcancel',window.SP,{passive:false});
    pb.addEventListener('mousedown',window.ST);
    pb.addEventListener('mouseup',window.SP);
    pb.addEventListener('mouseleave',window.SP);
    lg('PTT listeners attached');
  }
},0);

window.addEventListener('error',function(e){lg('ERR',e.message,'@',e.lineno)});

// ==== AUTO-START WS ====
wsConn();
lg('init done');

// Notif saat sudah konek
var origOnopen=null;
</script></body></html>

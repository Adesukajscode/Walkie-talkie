<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Walkie</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:system-ui;background:#0a0a0f;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.w{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px}
h1{text-align:center;color:#00e0ff;font-size:1rem;letter-spacing:3px}
.bar{text-align:center;padding:10px;background:#14141c;border-radius:8px;font-size:.75rem;color:#5a6580}
.led{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff3860;margin-right:6px}
.led.on{background:#00ff88;box-shadow:0 0 10px #00ff88}
.led.w{background:#ffb300;box-shadow:0 0 10px #ffb300}
input{padding:13px;border-radius:10px;border:1px solid #252532;background:#14141c;color:#fff;font-size:1rem;outline:none;width:100%}
input:focus{border-color:#00e0ff}
button{padding:13px;border:none;border-radius:10px;font-weight:800;font-size:.8rem;cursor:pointer;text-transform:uppercase;letter-spacing:1px;width:100%;font-family:inherit}
button:active{transform:scale(.97)}
.p{background:#00e0ff;color:#000}
.g{background:#00ff88;color:#001a0d}
.r{background:#ff3860;color:#fff}
.row{display:flex;gap:6px}
.row button{flex:1}
.ptt{padding:40px;border-radius:50%;width:140px;height:140px;margin:10px auto;background:#1a1a22;border:3px solid #2a2a35;color:#888;font-size:.85rem;font-weight:900;letter-spacing:3px}
.ptt.on{background:#5a1a3a;border-color:#ff2d95;color:#fff;box-shadow:0 0 40px #ff2d95}
.ptt:disabled{opacity:.4}
.h{display:none!important}
#ts{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-120px);background:#1a1a22;border:1px solid #252532;padding:11px 18px;border-radius:10px;font-size:.78rem;transition:.3s;pointer-events:none;z-index:999}
#ts.on{transform:translateX(-50%) translateY(0)}
#ts.e{border-color:#ff3860;color:#ff3860}
#ts.k{border-color:#00ff88;color:#00ff88}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:24px;z-index:100}
#modal.on{display:flex}
.card{background:#1a1a22;border:1px solid #ffb300;border-radius:16px;padding:24px;text-align:center;max-width:320px;width:100%}
.card p{color:#ffb300;font-size:.85rem;text-transform:uppercase;margin-bottom:12px;letter-spacing:1px}
.card b{color:#00e0ff;display:block;font-size:1.2rem;margin-bottom:16px;font-family:monospace}
audio{display:none}
</style></head><body>
<div id=ts></div>
<audio id=ra autoplay playsinline></audio>
<div class=w>
<h1>WALKIE</h1>
<div class=bar><span class=led id=led></span><span id=st>OFFLINE</span></div>
<div id=form1>
<input id=mn type=tel placeholder="08..." inputmode=numeric maxlength=15>
<button class=p onclick=R() style=margin-top:8px>MULAI</button>
</div>
<div id=form2 class=h>
<div class=bar id=idv>----</div>
<button class=ptt id=pb disabled ontouchstart="ST(event)" ontouchend="SP(event)" ontouchcancel="SP(event)" onmousedown="ST(event)" onmouseup="SP(event)">PTT</button>
<div class=row>
<button class=g onclick=M()>MATCH</button>
<button class=g onclick=C()>PANGGIL</button>
</div>
<input id=tn type=tel placeholder="nomor tujuan" inputmode=numeric maxlength=15>
<div class=row>
<button class=r onclick=E()>AKHIRI</button>
<button class=r onclick=L()>KELUAR</button>
</div>
</div>
</div>
<div id=modal><div class=card><p>📞 Panggilan masuk</p><b id=ci>----</b><div class=row><button class=g onclick=A()>Terima</button><button class=r onclick=X()>Tolak</button></div></div></div>
<script>
'use strict';
var $ = function(i){return document.getElementById(i)};
var cl = function(n){return String(n||'').replace(/\D/g,'')};
var lg = function(){console.log.apply(console,['[W]'].concat([].slice.call(arguments)))};
var ttm = null;
function ts(m,c){var e=$('ts');e.textContent=m;e.className=(c?'on '+c:'on');clearTimeout(ttm);ttm=setTimeout(function(){e.className=(c||'')},2500)}

var ws=null,wr=false,retry=0,pingT=null;
var my=localStorage.getItem('myNo')||'';
var tg='',caller=false;
var pc=null,ls=null,rs=null,pend=[],rds=false;
var po=null,pf=null;
var ra=$('ra');
ra.muted=false;ra.volume=1;

var WU = (location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';

function st(t){$('st').textContent=t}
function led(c){$('led').className='led'+(c?' '+c:'')}

function wsConn(){
  lg('ws ->',WU);
  st('CONNECTING');led('w');
  try{ws=new WebSocket(WU)}catch(e){st('ERR');setTimeout(wsConn,1500);return}
  ws.onopen=function(){
    wr=true;retry=0;lg('ws OPEN');
    st('ONLINE');led('on');
    if(my){wsSend({type:'register',no:my});lg('auto-reg',my)}
    clearInterval(pingT);pingT=setInterval(function(){wsSend({type:'ping'})},20000);
  };
  ws.onmessage=function(e){try{om(JSON.parse(e.data))}catch(err){lg('parse',err)}};
  ws.onclose=function(e){
    wr=false;clearInterval(pingT);lg('ws CLOSE',e.code);
    st('RECONNECT');led('w');retry++;
    setTimeout(wsConn,Math.min(800*retry,4000));
  };
  ws.onerror=function(){lg('ws ERR');st('ERR');led()};
}
function wsSend(o){if(ws&&ws.readyState===1){try{ws.send(JSON.stringify(o))}catch(e){}}else lg('ws not ready',o.type)}

var lp=null;
function getMic(){
  if(ls)return Promise.resolve(ls);
  if(lp)return lp;
  lp = navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}})
    .then(function(s){
      ls=s;
      s.getAudioTracks().forEach(function(t){t.enabled=false});
      lg('mic OK');
      return s;
    }).catch(function(e){lp=null;lg('mic err',e.message);throw e});
  return lp;
}

function om(m){
  var t=m.type;
  if(t==='pong'||t==='welcome')return;
  lg('<-',t);
  if(t==='registered'){
    my=m.no;localStorage.setItem('myNo',m.no);
    $('form1').classList.add('h');
    $('form2').classList.remove('h');
    $('idv').textContent=m.no;
    ts('✅ '+m.no,'k');
    getMic().catch(function(){});
  }
  else if(t==='error'){ts('❌ '+m.msg,'e')}
  else if(t==='online'){lg('online',m.list)}
  else if(t==='match-found'){
    ts('🎯 match '+m.no,'k');
    tg=m.no;caller=true;
    doCall();
  }
  else if(t==='incoming'){
    po=m.sdp;pf=m.from;
    $('ci').textContent=m.from;
    $('modal').classList.add('on');
  }
  else if(t==='accepted'){onAccepted()}
  else if(t==='rejected'){ts('ditolak','e');cleanup()}
  else if(t==='ended'){ts('selesai');cleanup()}
  else if(t==='sdp'){onSdp(m)}
  else if(t==='ice'){onIce(m)}
}

function R(){
  var n=cl($('mn').value);
  if(!n)return ts('masukkan nomor','e');
  if(n.length<8)return ts('min 8 digit','e');
  my=n;localStorage.setItem('myNo',n);
  if(wr)wsSend({type:'register',no:n});
  else ts('menunggu koneksi','e');
}

function M(){
  if(!wr)return ts('belum konek','e');
  ts('🔍 mencari','k');
  wsSend({type:'match'});
}

function C(){
  var t=cl($('tn').value);
  if(!t)return ts('nomor tujuan kosong','e');
  if(t===my)return ts('tidak bisa diri sendiri','e');
  tg=t;caller=true;
  doCall();
}

function doCall(){
  ts('memanggil '+tg);
  getMic().then(function(){
    if(!pc)mkPC();
    return pc.createOffer();
  }).then(function(o){
    return pc.setLocalDescription(o);
  }).then(function(){
    wsSend({type:'call',to:tg,sdp:pc.localDescription});
  }).catch(function(e){ts('gagal','e');lg('doCall',e.message)});
}

function A(){
  $('modal').classList.remove('on');
  if(!po)return;
  tg=pf;caller=false;
  ts('menyambung');
  getMic().then(function(){
    if(!pc)mkPC();
    return pc.setRemoteDescription(new RTCSessionDescription(po));
  }).then(function(){
    rds=true;return flushICE();
  }).then(function(){
    return pc.createAnswer();
  }).then(function(a){
    return pc.setLocalDescription(a);
  }).then(function(){
    wsSend({type:'accept',to:tg});
    wsSend({type:'sdp',to:tg,sdp:pc.localDescription});
    po=null;
  }).catch(function(e){ts('gagal','e');lg('accept',e.message)});
}

function X(){$('modal').classList.remove('on');if(pf)wsSend({type:'reject',to:pf});po=null;pf=null}
function E(){if(tg&&wr)wsSend({type:'end',to:tg});cleanup();ts('selesai')}
function L(){try{wsSend({type:'end',to:tg})}catch(e){}localStorage.removeItem('myNo');location.reload()}

function mkPC(){
  if(pc)return pc;
  if(!ls||!ls.getAudioTracks().length)return null;
  var tr=ls.getAudioTracks()[0];
  pc=new RTCPeerConnection({
    iceServers:[{urls:'stun:stun.l.google.com:19302'}],
    iceCandidatePoolSize:10,
    bundlePolicy:'max-bundle'
  });
  pc.addTrack(tr,new MediaStream([tr]));
  pc.ontrack=function(e){
    lg('ONTRACK');
    if(e.streams&&e.streams[0])rs=e.streams[0];
    else{if(!rs)rs=new MediaStream();rs.addTrack(e.track)}
    ra.srcObject=rs;ra.muted=false;ra.volume=1;
    ra.play().then(function(){lg('play OK')}).catch(function(err){lg('play err',err.message)});
  };
  pc.onicecandidate=function(e){
    if(e.candidate)wsSend({type:'ice',to:tg,ice:e.candidate});
  };
  pc.onconnectionstatechange=function(){
    lg('PC',pc.connectionState);
    if(pc.connectionState==='connected'){
      $('pb').disabled=false;
      ts('✅ live','k');
    }
  };
  return pc;
}

function flushICE(){
  if(!pc||!rds)return Promise.resolve();
  var c=Promise.resolve();
  while(pend.length){
    (function(ice){c=c.then(function(){return pc.addIceCandidate(ice).catch(function(){})})})(pend.shift());
  }
  return c;
}

function onAccepted(){
  if(!pc)mkPC();
  pc.createOffer().then(function(o){return pc.setLocalDescription(o)})
    .then(function(){wsSend({type:'sdp',to:tg,sdp:pc.localDescription})})
    .catch(function(e){lg('oA',e.message)});
}

function onSdp(m){
  if(!pc)return;
  var desc=new RTCSessionDescription(m.sdp);
  if(desc.type==='answer'){
    pc.setRemoteDescription(desc).then(function(){rds=true;return flushICE()}).catch(function(e){lg('ans',e.message)});
  }else if(desc.type==='offer'){
    pc.setRemoteDescription(desc).then(function(){
      rds=true;return flushICE();
    }).then(function(){
      return pc.createAnswer();
    }).then(function(a){
      return pc.setLocalDescription(a);
    }).then(function(){
      wsSend({type:'sdp',to:m.from,sdp:pc.localDescription});
    }).catch(function(e){lg('off',e.message)});
  }
}

function onIce(m){
  if(!pc)return;
  var c=new RTCIceCandidate(m.ice);
  if(!rds){pend.push(c);return}
  pc.addIceCandidate(c).catch(function(){});
}

function cleanup(){
  try{if(pc)pc.close()}catch(e){}
  pc=null;
  try{if(ls)ls.getTracks().forEach(function(t){t.stop()})}catch(e){}
  ls=null;lp=null;rs=null;ra.srcObject=null;
  pend=[];rds=false;
  $('pb').disabled=true;
  $('pb').classList.remove('on');
  po=null;pf=null;
}

function ST(e){
  if(e){e.preventDefault();if(e.stopPropagation)e.stopPropagation()}
  try{
    if(!ls||!ls.getAudioTracks)return ts('mic belum siap','e');
    var t=ls.getAudioTracks()[0];
    if(t)t.enabled=true;
    ra.volume=0;
    $('pb').classList.add('on');
    if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}
    lg('PTT ON');
  }catch(err){lg('ST err',err.message)}
}
function SP(e){
  if(e){e.preventDefault();if(e.stopPropagation)e.stopPropagation()}
  try{
    if(ls&&ls.getAudioTracks)ls.getAudioTracks().forEach(function(t){t.enabled=false});
    ra.volume=1;
    $('pb').classList.remove('on');
    lg('PTT OFF');
  }catch(err){lg('SP err',err.message)}
}

window.addEventListener('error',function(e){lg('ERR',e.message)});
window.addEventListener('online',function(){if(!wr)wsConn()});

wsConn();
</script></body></html>

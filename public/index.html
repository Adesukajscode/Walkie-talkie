<!DOCTYPE html><html lang=id><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name=theme-color content=#0a0e17><title>Walkie Talkie</title><style>
:root{

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%}

}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--rd);flex-shrink:0;transition:.2s;
}
.dot.on{background:var(--lm);box-shadow:0 0 8px var(--lm)}
.dot.wn{background:var(--yl);box-shadow:0 0 8px var(--yl)}

/* ═══ SPINNER ═══ */
.spin{
  width:12px;height:12px;flex-shrink:0;
  border:2px solid rgba(0,212,255,.2);
  border-top-color:var(--cy);
  border-radius:50%;
  animation:sp .7s linear infinite;
  display:none;
}
.spin.on{display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* ═══ INPUT ═══ */
.ig{display:flex;gap:8px;margin-bottom:12px}

  flex:1;padding:13px 14px;border-radius:11px;

/* ═══ BUTTON ═══ */

.info-panel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 6px}
.info-box{background:rgba(0,0,0,.35);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;text-align:center}
.info-box .lbl{font-size:.6rem;color:var(--mu);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:3px}
.info-box .val{font-size:.95rem;font-weight:700;color:var(--cy);font-family:'Courier New',monospace;letter-spacing:.5px;display:block}
.info-box .unit{font-size:.65rem;color:var(--mu);font-weight:400;margin-left:2px}
.info-box.accent .val{color:var(--mg)}

function makeClipCurve(k,a){

  for(let i=0;i<n;i++){

// ═══════ FIX #1: Promise-guarded gm() → cegah double getUserMedia ═══════

async function gm(){

    if(!navigator.mediaDevices)throw Error('Browser tidak dukung mic');

      {audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1,sampleRate:48000},video:false},
      {audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false},
      {audio:{echoCancellation:true},video:false},
      {audio:true,video:false}
    ];
    let st,lastErr;
    for(const c of tried){
      try{st=await navigator.mediaDevices.getUserMedia(c);lg('✅ getUserMedia OK:',JSON.stringify(c.audio));break}
      catch(e){lastErr=e;lg('⚠️ constraint gagal:',e.name,e.message)}
    }
    if(!st)throw lastErr||Error('Semua constraint mic gagal');
    ls=st;
    st.getAudioTracks().forEach(x=>x.enabled=false);
    const t=st.getAudioTracks()[0];
    const g=t.getSettings();
    lg('🎤 MIC OK | label=',t.label,'| enabled=',t.enabled,'| EC=',g.echoCancellation,'| NS=',g.noiseSuppression,'| SR=',g.sampleRate);
    return st;
  })().catch(e=>{lsProm=null;throw e});

}

// ═══════ FIX #2: Explicit transceiver sendrecv → cegah 1-arah ═══════
function cp(){
  if(pc){lg('♻️ PC reuse');return pc}
  lg('🆕 createPC');
  if(!ls||!ls.getAudioTracks().length){lg('❌❌❌ TIDAK ADA AUDIO TRACK!');return null}

    iceServers:[{urls:'stun:stun.cloudflare.com:3478'},{urls:'stun:stun1.l.google.com:19302'}],

    rtcpMuxPolicy:'require'
  });

  const stream=new MediaStream([track]);
  const sender=pc.addTrack(track,stream);
  lg('✅ addTrack | enabled=',track.enabled,'| sender=',!!sender);
  // Codec: prefer Opus
  try{
    const caps=RTCRtpSender.getCapabilities('audio');
    if(caps&&caps.codecs){

      const rest=caps.codecs.filter(c=>c.mimeType.toLowerCase()!=='audio/opus');
      const tr=pc.getTransceivers()[0];
      if(tr&&tr.setCodecPreferences)tr.setCodecPreferences([...opus,...rest]);

  }catch(e){lg('codec pref err',e.message)}

    lg('📥 ONTRACK | kind=',e.track.kind,'| enabled=',e.track.enabled);
    if(e.streams&&e.streams[0])rst=e.streams[0];
    else{if(!rst)rst=new MediaStream();rst.addTrack(e.track)}
    // ⚠️ ra TIDAK diset ke rst — akan di-replace oleh DSP stream
    ra.muted=true;
    if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});
    const build=()=>{
      if(!ac||htChain)return;
      try{
        if(!an){an=ac.createAnalyser();an.fftSize=256}

        const hp2=ac.createBiquadFilter();hp2.type='highpass';hp2.frequency.value=400;hp2.Q.value=0.8;
        const lp1=ac.createBiquadFilter();lp1.type='lowpass';lp1.frequency.value=2800;lp1.Q.value=0.8;
        const lp2=ac.createBiquadFilter();lp2.type='lowpass';lp2.frequency.value=2800;lp2.Q.value=0.8;
        // Presence tajam — SEMBER
        const pk=ac.createBiquadFilter();pk.type='peaking';pk.frequency.value=2000;pk.gain.value=12;pk.Q.value=1.8;

        // Pre-emphasis
        const pre=ac.createBiquadFilter();pre.type='highshelf';pre.frequency.value=1400;pre.gain.value=6;

      // ══════ BILATERAL CHECK ══════
      setTimeout(()=>{
        lg('══════ BILATERAL CHECK ══════');
        const trs=pc.getTransceivers();
        trs.forEach((tr,i)=>lg(`  tr[${i}] dir=${tr.direction} cur=${tr.currentDirection} mid=${tr.mid}`));

        lg('📥 RECEIVERS:',rcvs.length?rcvs.map(x=>x.track.kind+':en='+x.track.enabled).join(', '):'❌ NONE');

        if(!rcvs.length)lg('❌❌❌ TERIMA GAGAL — tidak ada receiver track!');
        lg('═════════════════════════════');

    } else if(pc.connectionState==='failed'){$('ms').textContent='Koneksi gagal';try{pc.restartIce()}catch(_){}}
    else if(pc.connectionState==='disconnected')$('ms').textContent='Terputus sementara';
  };

}

// ═══ JARAK via RTT ═══
let distTimer=null,lastRtt=0;
async function updateDistance(){
  if(!pc||pc.connectionState!=='connected')return;
  try{
    const stats=await pc.getStats();
    let rtt=null,localCand=null,remoteCand=null;
    stats.forEach(r=>{
      if(r.type==='candidate-pair'&&r.state==='succeeded'&&r.nominated){
        if(r.currentRoundTripTime!=null)rtt=r.currentRoundTripTime;

      // Fiber ~200,000 km/s; udara ~300,000 km/s → rata-rata ~200,000 km/s
      const c=200000; // km/s
      const sec=rtt/2;
      let km=sec*c;
      // Kurangi overhead prosesing ~5ms → setengah nilai jadi lebih realistis
      km=Math.max(0,km-(0.005*c/2));
      let txt,unit;
      if(km<1){txt=(km*1000).toFixed(0);unit=' m'}
      else if(km<1000){txt=km.toFixed(1);unit=' km'}
      else{txt=(km/1000).toFixed(2);unit=' Mm'}
      const dv=$('distVal'),du=$('distUnit');
      if(dv&&du){dv.firstChild.textContent=txt;du.textContent=unit}
      lastRtt=rtt;
      lg('📍 RTT=',(rtt*1000).toFixed(1),'ms → jarak≈',txt+unit);
    } else {
      // RTT belum tersedia, tampilkan '—'
      const dv=$('distVal');if(dv)dv.firstChild.textContent='—';
    }
  }catch(e){}
}
function startDistLoop(){
  clearInterval(distTimer);
  distTimer=setInterval(updateDistance,1500);
  setTimeout(updateDistance,500);
}
function stopDistLoop(){
  clearInterval(distTimer);distTimer=null;
  const dv=$('distVal');if(dv)dv.firstChild.textContent='—';
}

// ═══ FREKUENSI DOMINAN (sudah pakai analyser existing) ═══
function computeFreq(d){
  // Cari bin dengan magnitude tertinggi
  let maxVal=0,maxBin=0;
  for(let i=1;i<d.length;i++){if(d[i]>maxVal){maxVal=d[i];maxBin=i}}
  // Bin → Hz: sampleRate/fftSize × bin
  const sr=ac?ac.sampleRate:48000;
  const hz=maxBin*sr/(an.fftSize);
  return {hz,maxVal};
}
function updateFreqUI(hz,mag){
  const fv=$('freqVal');if(!fv)return;
  if(mag<15){fv.firstChild.textContent='—';return}
  fv.firstChild.textContent=hz<1000?hz.toFixed(0):(hz/1000).toFixed(2);
  // Kalau >=1000, ganti unit ke kHz
  const un=fv.querySelector('.unit');
  if(un)un.textContent=hz<1000?'Hz':'kHz';
}

function wsConn(){
  lg('WS ->',WS_URL);net('w','Menghubungkan...');
  try{ws=new WebSocket(WS_URL)}catch(e){net('','LINK ERROR');setTimeout(wsConn,1500);return}
  ws.onopen=()=>{
    wsReady=true;retry=0;lg('✅ ws OPEN');net('ok','Online');
    if(my){wsSend({type:'register',no:my});rp=1;clearTimeout(rt);rt=setTimeout(()=>{if(rp){ts('Timeout','err');rp=0;rbReset()}},8e3)}
    clearInterval(pingT);pingT=setInterval(()=>wsSend({type:'ping'}),20000);
  };
  ws.onmessage=e=>{try{onMsg(JSON.parse(e.data))}catch(err){lg('parse',err)}};
  ws.onclose=ev=>{wsReady=false;clearInterval(pingT);lg('ws CLOSED',ev.code);net('w','Menyambung ulang...');retry++;setTimeout(wsConn,Math.min(800*retry,4000))};
  ws.onerror=()=>{lg('ws ERROR');net('','LINK ERROR')};
}
function wsSend(o){if(ws&&ws.readyState===1){try{ws.send(JSON.stringify(o))}catch(e){}}else lg('ws not ready',o.type)}
function onMsg(m){
  const t=m.type;
  if(t==='pong'||t==='welcome')return;
  lg('<-',t);
  if(t==='registered'){
    rp=0;clearTimeout(rt);
    my=m.no;localStorage.setItem('myNo',m.no);
    $('rs').classList.add('h');$('cs').classList.remove('h');
    $('ms').textContent='ID: '+m.no;$('ms').className='st ok';
    rbReset();ts('✅ '+m.no,'ok');
    // ⚡ PREWARM AGGRESSIF: siapkan mic + PC segera
    gm().then(()=>prewarmPC()).catch(()=>{});
  }
  else if(t==='error'){rp=0;clearTimeout(rt);rbReset();ts('❌ '+m.msg,'err')}
  else if(t==='online'){$('ol').textContent='Online: '+(m.list.join(', ')||'-')}
  else if(t==='force-logout'){ts('Nomor dipakai di HP lain','err');setTimeout(L,1500)}
  // ═══════ FIX #3: Bundle offer dalam incoming-call ═══════
  else if(t==='incoming-call'){
    lg('📞 incoming from',m.from,'hasOffer=',!!m.offer);
    ra.play().catch(()=>{});
    pendingOffer=m.offer;pendingFrom=m.from;
    $('ci').textContent=m.from;$('nf').classList.add('on');
    if(navigator.vibrate)navigator.vibrate([200,100,200]);
    // ⚡ Prewarm mic + PC di background sambil user baca notif
    gm().then(()=>prewarmPC()).catch(()=>{});
  }
  else if(t==='call-rejected'){$('ms').textContent='Ditolak';cl_()}
  else if(t==='call-ended'){$('ms').textContent='Selesai';cl_()}
  else if(t==='call-error'){ts(m.msg,'err');$('ms').textContent=m.msg;$('ms').className='st err'}
  else if(t==='answer'){onAnswer(m)}
  else if(t==='ice-candidate'){onIce(m)}
}
// ═══════ CALLER: offer bundled dengan call-user ═══════
async function C(){
  tg=cl($('tn').value);
  if(!tg)return ts('Masukkan nomor tujuan','err');
  if(tg===my)return ts('Tidak bisa panggil sendiri','err');
  if(!wsReady)return ts('Belum konek','err');
  caller=1;
  $('ms').textContent='Memanggil '+tg+'...';$('ms').className='st';
  try{
    if(!ls)await gm();
    if(!pc){const p=cp();if(!p)return ts('Mic gagal','err')}
    const o=await pc.createOffer();
    await pc.setLocalDescription(o);
    const sdp=pc.localDescription.sdp;
    const SR=sdp.includes('a=sendrecv'),SO=sdp.includes('a=sendonly'),RO=sdp.includes('a=recvonly'),IA=sdp.includes('a=inactive');
    lg('📤 OFFER | sendrecv=',SR,'| sendonly=',SO,'| recvonly=',RO,'| inactive=',IA);
    pc.getTransceivers().forEach((tr,i)=>lg(`  tr[${i}] dir=${tr.direction} cur=${tr.currentDirection}`));
    const snds=pc.getSenders().filter(x=>x.track);
    lg('📤 senders:',snds.length?snds.map(x=>x.track.kind).join(','):'NONE');
    wsSend({type:'call-user',to:tg,sdp:pc.localDescription});
  }catch(e){lg('call err',e);ts('Gagal: '+e.message,'err')}
}
// ═══════ CALLEE: accept → langsung setRemoteDescription + answer ═══════
async function A(){
  $('nf').classList.remove('on');
  if(!pendingOffer)return ts('Tidak ada offer','err');
  tg=pendingFrom;caller=0;
  $('ms').textContent='Menyambung...';
  try{
    if(!ls)await gm();
    if(!pc){const p=cp();if(!p)return ts('Mic gagal','err')}
    lg('📥 setRemoteDescription...');
    await pc.setRemoteDescription(new RTCSessionDescription(pendingOffer));
    rds=1;await fc();
    const a=await pc.createAnswer();
    await pc.setLocalDescription(a);
    const sdp=pc.localDescription.sdp;
    const SR=sdp.includes('a=sendrecv'),SO=sdp.includes('a=sendonly'),RO=sdp.includes('a=recvonly'),IA=sdp.includes('a=inactive');
    lg('📥 ANSWER | sendrecv=',SR,'| sendonly=',SO,'| recvonly=',RO,'| inactive=',IA);
    pc.getTransceivers().forEach((tr,i)=>lg(`  tr[${i}] dir=${tr.direction} cur=${tr.currentDirection}`));
    const snds=pc.getSenders().filter(x=>x.track);
    lg('📤 senders:',snds.length?snds.map(x=>x.track.kind).join(','):'NONE');
    wsSend({type:'answer',to:tg,sdp:pc.localDescription});
    pendingOffer=null;
  }catch(e){lg('accept err',e);ts('Gagal: '+e.message,'err')}
}
async function onAnswer(m){
  try{
    if(!pc)return;
    lg('📥 answer diterima');
    await pc.setRemoteDescription(new RTCSessionDescription(m.sdp));
    rds=1;await fc();
  }catch(e){lg('ans err',e)}
}
async function onIce(m){
  if(!pc)return;const c=new RTCIceCandidate(m.candidate);
  if(!rds){pend.push(c);return}
  try{await pc.addIceCandidate(c)}catch(e){}
}
function H(){
  htOn=!htOn;
  $('htb').textContent=htOn?'📻 HT ON':'📻 HT OFF';
  if(htChain){
    htChain.inG.gain.value=htOn?3.2:1;
    htChain.agc.threshold.value=htOn?-32:0;
    htChain.agc.ratio.value=htOn?14:1;
    htChain.hp1.frequency.value=htOn?400:20;
    htChain.hp2.frequency.value=htOn?400:20;
    htChain.lp1.frequency.value=htOn?2800:20000;
    htChain.lp2.frequency.value=htOn?2800:20000;
    htChain.pk.gain.value=htOn?12:0;
    htChain.cut.gain.value=htOn?-8:0;
    htChain.pre.gain.value=htOn?6:0;
    htChain.clip.curve=htOn?makeClipCurve(11,0.4):null;
    htChain.out.gain.value=htOn?2.3:1;
    htChain.ng.gain.value=htOn?0.008:0;
  }
  if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});
  ts(htOn?'📻 HT MODE':'🔊 NORMAL','ok');
  lg('HT',htOn?'ON':'OFF');
}
function U(a){ra.muted=false;ra.volume=1;ra.play().then(()=>{if(a)ts('🔊 Audio aktif','ok')}).catch(e=>{if(a)ts('⚠️ Tap lagi','err')})}
function R(){
  const n=cl($('mn').value);
  if(!n)return ts('Masukkan nomor','err');
  if(n.length<8)return ts('Nomor < 8 digit','err');
  if(n.length>15)return ts('Nomor terlalu panjang','err');
  if(!/^(0|62)?8\d{7,13}$/.test(n))return ts('Format 08xxx','err');
  if(!wsReady)return ts('Belum konek','err');
  my=n;localStorage.setItem('myNo',n);rp=1;
  wsSend({type:'register',no:n});
  $('rb').textContent='...';$('rb').disabled=1;$('mn').disabled=1;
  clearTimeout(rt);rt=setTimeout(()=>{if(rp){ts('Timeout','err');rp=0;rbReset()}},8e3);
}
function L(){try{wsSend({type:'unregister'});E()}catch(_){}localStorage.removeItem('myNo');setTimeout(()=>location.reload(),200)}
function X(){$('nf').classList.remove('on');if(pendingFrom)wsSend({type:'reject-call',to:pendingFrom});pendingOffer=null;pendingFrom=null}
function E(){if(tg&&wsReady)wsSend({type:'end-call',to:tg});cl_();$('ms').textContent='Selesai';$('ms').className='st'}
function cl_(){
  try{pc&&pc.close()}catch(_){}pc=null;
  try{ls&&ls.getTracks().forEach(t=>t.stop())}catch(_){}ls=null;lsProm=null;
  rst=null;ra.srcObject=null;stopDistLoop();if(htChain){try{htChain.src.disconnect();htChain.out.disconnect();htChain.ns.stop();htChain.dest.disconnect()}catch(_){}htChain=null}
  pend=[];rds=0;cancelAnimationFrame(raf);$('vu').style.width='0';
  micMuted=true;$('pb').disabled=true;$('pb').classList.remove('on');$('pb').textContent='🎙 MIC ON';
  pendingOffer=null;pendingFrom=null;
}
function startTalk(e){
  if(e)e.preventDefault();
  if(!ls)return;
  micMuted=true;
  ls.getAudioTracks().forEach(t=>t.enabled=true);
  $('pb').classList.add('on');
  $('pb').textContent='🔴 BICARA...';
  if(navigator.vibrate)navigator.vibrate(15);
  lg('PTT ON');
}
function stopTalk(e){
  if(e){e.preventDefault();if(e.stopPropagation)e.stopPropagation()}
  if(!ls)return;
  ls.getAudioTracks().forEach(t=>t.enabled=false);
  micMuted=true;
  $('pb').classList.remove('on');
  $('pb').textContent='TAHAN UNTUK BICARA';
  lg('🔇 PTT OFF');
}
wsConn();

<script>

const $=i=>document.getElementById(i),cl=n=>String(n||'').replace(/\D/g,''),lg=(...a)=>console.log('[WT]',...a);

let my=localStorage.getItem('myNo')||'',tg='',caller=0,pc=null,ls=null,rst=null,pend=[],rds=0,mo=0,ac=null,an=null,raf=null,rp=0,rt=null;

document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement('span');d.style.cssText=`position:absolute;border-radius:50%;pointer-events:none;width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 70%);transform:scale(0);opacity:.9;animation:rip .6s ease-out`;b.appendChild(d);setTimeout(()=>d.remove(),620)});

async function gm(){if(ls)return ls;if(!navigator.mediaDevices)throw Error('Browser tidak dukung mic');ls=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:1,noiseSuppression:1,autoGainControl:1,channelCount:1},video:0});ls.getAudioTracks().forEach(t=>t.enabled=0);lg('mic OK');return ls}

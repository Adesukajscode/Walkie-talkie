<!DOCTYPE html><html lang=id><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name=theme-color content=#0a0a0f><title>Walkie</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%}
body{font-family:-apple-system,system-ui,sans-serif;background:radial-gradient(ellipse at 50% 10%,#1a1a28,#0a0a0f 70%);color:#eaf0ff;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:20px}
.wrap{width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px}
/* ==== HT DEVICE ==== */
.ht{position:relative;padding-top:100px}
.ant{position:absolute;top:0;left:50%;transform:translateX(-50%);width:10px;height:100px;display:flex;flex-direction:column;align-items:center;z-index:2}
.ant .seg1{flex:1;width:100%;background:linear-gradient(180deg,#4a4a58,#2a2a35);border-radius:3px 3px 1px 1px;box-shadow:inset -2px 0 3px rgba(0,0,0,.5)}
.ant .seg2{flex:.8;width:80%;background:linear-gradient(180deg,#3a3a48,#1e1e28);border-radius:3px 3px 1px 1px;margin-top:2px;box-shadow:inset -2px 0 3px rgba(0,0,0,.5)}
.ant .seg3{flex:.6;width:60%;background:linear-gradient(180deg,#2a2a35,#0d0d12);border-radius:3px 3px 1px 1px;margin-top:2px}
.ant .tip{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a4a58,#0a0a0f);margin-top:-2px}
/* Top knobs */
.topbar{display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px;margin-bottom:-6px;position:relative;z-index:3}
.knob{width:30px;height:24px;background:linear-gradient(180deg,#3a3a48,#15151c);border-radius:6px 6px 3px 3px;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),inset 0 -2px 4px rgba(0,0,0,.5)}
.knob::after{content:'';position:absolute;top:50%;left:50%;width:2px;height:8px;background:#5a5a68;transform:translate(-50%,-50%);border-radius:1px}
.knob::before{content:'';position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:22px;height:4px;background:#0a0a0f;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.led{width:11px;height:11px;border-radius:50%;background:#3a1010;margin-bottom:8px;transition:.2s;box-shadow:inset 0 1px 2px rgba(0,0,0,.8),0 0 0 2px #0a0a0f}
.led.o{background:#00ff88;box-shadow:0 0 14px #00ff88,0 0 0 2px #0a0a0f}
.led.n{background:#ffb300;box-shadow:0 0 14px #ffb300,0 0 0 2px #0a0a0f}
.led.tx{background:#ff2d95;box-shadow:0 0 18px #ff2d95,0 0 0 2px #0a0a0f;animation:bl .35s infinite}
.led.rx{background:#0aff8a;box-shadow:0 0 22px #0aff8a,0 0 0 2px #0a0a0f}
@keyframes bl{50%{opacity:.4}}
/* Body */
.body{background:linear-gradient(180deg,#252530,#12121a 60%,#0a0a10);border-radius:14px 14px 22px 22px;padding:16px 14px 18px;position:relative;box-shadow:inset 0 2px 0 rgba(255,255,255,.1),inset 0 -4px 8px rgba(0,0,0,.6),0 20px 40px rgba(0,0,0,.6)}
.body::before{content:'';position:absolute;inset:6px;border-radius:10px 10px 18px 18px;border:1px solid rgba(255,255,255,.04);pointer-events:none}
/* LCD */
.lcd{background:linear-gradient(180deg,#0d2418,#061410);border:1px solid #1a3020;border-radius:6px;padding:10px 12px;font-family:ui-monospace,'Courier New',monospace;color:#00ff88;text-shadow:0 0 6px rgba(0,255,136,.8);margin-bottom:12px;position:relative;overflow:hidden;min-height:90px;box-shadow:inset 0 2px 6px rgba(0,0,0,.8)}
.lcd::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,255,136,.06) 0 1px,transparent 1px 3px);pointer-events:none}
.lcd .r1{font-size:.6rem;letter-spacing:2.5px;text-transform:uppercase;opacity:.8;margin-bottom:4px}
.lcd .r2{font-size:1.15rem;letter-spacing:2px;font-weight:700;margin-bottom:8px}
.lcd .r3{display:flex;justify-content:space-between;font-size:.65rem;opacity:.9}
.lcd .r3 span{white-space:nowrap}
.lcd .r3 b{font-weight:700}
/* Speaker grille */
.grille{height:44px;margin:10px 34px;background:radial-gradient(circle,rgba(255,255,255,.18) 1.2px,transparent 1.5px) 0 0/7px 7px;border-radius:5px;position:relative;opacity:.5;border:1px solid rgba(0,0,0,.5);box-shadow:inset 0 2px 4px rgba(0,0,0,.7),inset 0 -1px 0 rgba(255,255,255,.05)}
/* PTT */
.pttwrap{display:flex;justify-content:center;padding:6px 0 8px}
.ptt{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#4a4a58,#1e1e28 55%,#0a0a10);border:2px solid #2a2a35;color:#7a7a88;font-family:inherit;font-size:.72rem;font-weight:900;letter-spacing:5px;text-transform:uppercase;padding:0;cursor:pointer;touch-action:none;-webkit-touch-callout:none;position:relative;box-shadow:inset 0 4px 0 rgba(255,255,255,.1),inset 0 -8px 14px rgba(0,0,0,.75),0 8px 18px rgba(0,0,0,.6),0 0 0 4px #0a0a10;transition:.15s cubic-bezier(.2,.9,.3,1.3)}
.ptt::before{content:'';position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.06),transparent 60%);pointer-events:none}
.ptt:disabled{opacity:.4}
.ptt.on{border-color:#ff2d95;color:#fff;background:radial-gradient(circle at 38% 32%,#6a1a4a,#2a0a1f 55%,#0a0a10);box-shadow:inset 0 4px 0 rgba(255,45,149,.3),0 8px 24px rgba(255,45,149,.4),0 0 0 4px #0a0a10,0 0 40px rgba(255,45,149,.6);transform:scale(.97)}
.ptt.on::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(255,45,149,.7);animation:ping 1.2s ease-out infinite;pointer-events:none}
@keyframes ping{0%{inset:-4px;opacity:1}100%{inset:-26px;opacity:0}}
/* Keys row */
.keys{display:flex;justify-content:center;gap:6px;margin-top:10px}
.k{padding:8px 10px;border:1px solid #2a2a35;background:linear-gradient(180deg,#2a2a35,#15151c);border-radius:6px;color:#8a8a98;font-size:.62rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-family:inherit;flex:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 4px rgba(0,0,0,.4)}
.k:active{background:#00e0ff;color:#000;border-color:#00e0ff;transform:translateY(1px)}
.k.on{background:#00e0ff;color:#000;border-color:#00e0ff}
/* Panels */
.panel{display:flex;gap:6px;width:100%}
.panel input{flex:1;padding:13px 14px;border-radius:11px;border:1px solid #252532;background:#14141c;color:#fff;font-size:.9rem;font-family:inherit;outline:none;min-width:0}
.panel input::placeholder{color:#5a6580}
.panel input:focus{border-color:#00e0ff}
.panel button{padding:13px 18px;border:none;border-radius:11px;font-size:.78rem;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:1px;text-transform:uppercase;flex-shrink:0}
.panel button:active{transform:scale(.96)}
.b1{background:#00e0ff;color:#000}
.b2{background:#00ff88;color:#001a0d}
.h{display:none!important}
/* Incoming call modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:200;padding:24px}
.modal.on{display:flex}
.mcard{background:linear-gradient(180deg,#1e1e28,#0d0d12);border:1px solid #ffb300;border-radius:18px;padding:24px;text-align:center;max-width:320px;width:100%;box-shadow:0 0 40px rgba(255,179,0,.4)}
.mcard .ico{font-size:2.4rem;margin-bottom:8px;animation:sh 1s ease-in-out infinite}
@keyframes sh{50%{transform:scale(1.15)}}
.mcard p{color:#ffb300;font-size:.82rem;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px}
.mcard b{color:#00e0ff;display:block;font-size:1.15rem;margin-top:6px;font-family:ui-monospace,monospace;letter-spacing:2px}
.mcard .row{display:flex;gap:8px;margin-top:16px}
.mcard .row button{flex:1;padding:14px;border-radius:11px;border:none;font-weight:800;font-size:.82rem;letter-spacing:1px;text-transform:uppercase;cursor:pointer;font-family:inherit}
.yes{background:#00ff88;color:#001a0d}
.no{background:transparent;border:1px solid #252532!important;color:#7d8ab0}
/* Toast */
#ts{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);background:#14141c;border:1px solid #252532;padding:12px 20px;border-radius:12px;font-size:.78rem;z-index:999;transition:.35s cubic-bezier(.2,.9,.3,1.4);max-width:90vw;text-align:center;pointer-events:none;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#ts.on{transform:translateX(-50%) translateY(0)}
#ts.e{border-color:#ff3860;color:#ff3860}
#ts.k{border-color:#00ff88;color:#00ff88}
/* Offline badge */
#ob{position:fixed;top:0;left:0;right:0;background:#ff3860;color:#fff;text-align:center;font-size:.65rem;font-weight:800;padding:5px;letter-spacing:2.5px;text-transform:uppercase;z-index:1000;transform:translateY(-100%);transition:.3s}
#ob.on{transform:translateY(0)}
audio{display:none}
</style></head><body>
<div id=ob>⚠️ OFFLINE</div>
<div id=ts></div>
<audio id=ra autoplay playsinline></audio>
<div class=wrap>
<div class=ht>
<div class=ant><div class=seg1></div><div class=seg2></div><div class=seg3></div><div class=tip></div></div>
<div class=topbar><div class=knob></div><div class=led id=led></div><div class=knob></div></div>
<div class=body>
<div class=lcd>
<div class=r1 id=nt>OFFLINE</div>
<div class=r2 id=idv>----</div>
<div class=r3><span>📍 <b id=dv>--</b></span><span>🎵 <b id=fv>--</b></span></div>
</div>
<div class=grille></div>
<div class=pttwrap><button class=ptt id=pb disabled ontouchstart="ST(event)" ontouchend="SP(event)" ontouchcancel="SP(event)" onmousedown="ST(event)" onmouseup="SP(event)" onmouseleave="SP(event)">PTT</button></div>
<div class=keys>
<button class=k id=km onclick=M()>MATCH</button>
<button class=k onclick=E()>⏻ AKHIRI</button>
</div>
<div class=keys>
<button class=k onclick=U()>🔊 AUDIO</button>
<button class=k onclick=L()>↻ KELUAR</button>
</div>
</div>
</div>
<div id=formReg class=panel><input type=tel id=mn placeholder="08..." inputmode=numeric autocomplete=off maxlength=15><button class=b1 onclick=R()>MULAI</button></div>
<div id=formCall class="panel h"><input type=tel id=tn placeholder="nomor tujuan" inputmode=numeric autocomplete=off maxlength=15><button class=b2 onclick=C()>PANGGIL</button></div>
</div>
<div class=modal id=inc><div class=mcard><div class=ico>📞</div><p>Panggilan masuk</p><b id=ci>----</b><div class=row><button class=yes onclick=A()>Terima</button><button class=no onclick=X()>Tolak</button></div></div></div>
<script>
'use strict';
var $=function(i){return document.getElementById(i)};
var cl=function(n){return String(n||'').replace(/\D/g,'')};
var lg=function(){console.log.apply(console,['[WT]'].concat([].slice.call(arguments)))};
var tt=null;
function ts(m,c){var e=$('ts');e.textContent=m;e.className=(c?'ts on '+c:'ts on');clearTimeout(tt);tt=setTimeout(function(){e.className='ts'+(c?' '+c:'')},3000)}

/* ============== STATE ============== */
var ws=null,wr=false,retry=0,pingT=null;
var my=localStorage.getItem('myNo')||'';
var tg='',caller=false,matching=false;
var pc=null,ls=null,rs=null,pend=[],rds=false;
var po=null,pf=null;
var ac=null,an=null,raf=null;
var activeTx=null,rTrack=null;
var ra=$('ra');
var rttTimer=null,myLoc=null,peerLoc=null,geoTimer=null;
var WU=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';

/* ============== AUDIO (SINGLE PATH) ============== */
ra.muted=false;ra.volume=1;
function ensurePlay(){
  if(!ra.srcObject)return;
  if(ac&&ac.state==='suspended')ac.resume().catch(function(){});
  ra.play().catch(function(){});
}
document.addEventListener('touchstart',function(){ensurePlay()},{passive:true});
document.addEventListener('click',function(){ensurePlay()});

/* ============== MIC (LOW LATENCY) ============== */
var lp=null;
function getMic(){
  if(ls)return Promise.resolve(ls);
  if(lp)return lp;
  var constraints={
    audio:{
      echoCancellation:true,
      noiseSuppression:true,
      autoGainControl:true,
      channelCount:1,
      sampleRate:48000,
      latency:0.01,
      googEchoCancellation:true,
      googAutoGainControl:true,
      googNoiseSuppression:true,
      googHighpassFilter:true,
      googAudioMirroring:false,
      googTypingNoiseDetection:true
    },
    video:false
  };
  lp=navigator.mediaDevices.getUserMedia(constraints)
    .catch(function(){return navigator.mediaDevices.getUserMedia({audio:true,video:false})})
    .then(function(s){
      ls=s;
      ls.getAudioTracks().forEach(function(t){t.enabled=false});
      activeTx=ls.getAudioTracks()[0];
      lg('MIC OK');
      return ls;
    })
    .catch(function(e){lp=null;lg('MIC ERR',e.message);throw e});
  return lp;
}
getMic().catch(function(){});

/* ============== SDP MUNGE (LOW LATENCY OPUS) ============== */
function munge(sdp){
  if(!sdp)return sdp;
  return sdp.replace(/a=fmtp:(\d+) ([^\r\n]+)/g,function(m,pt,params){
    if(params.indexOf('opus')===-1)return m;
    return 'a=fmtp:'+pt+' minptime=10;useinbandfec=1;usedtx=0;stereo=0;sprop-stereo=0;maxplaybackrate=16000;maxaveragebitrate=24000';
  });
}

/* ============== WEBSOCKET ============== */
function setBar(t){var e=$('nt');if(e)e.textContent=t}
function wsConn(){
  lg('ws->',WU);
  setBar('CONNECTING');
  try{ws=new WebSocket(WU)}catch(e){setBar('LINK ERROR');setTimeout(wsConn,1500);return}
  ws.onopen=function(){
    wr=true;retry=0;
    lg('ws OPEN');
    setBar('ONLINE');
    if(my){wsSend({type:'register',no:my});lg('auto-reg',my)}
    clearInterval(pingT);
    pingT=setInterval(function(){wsSend({type:'ping'})},20000);
  };
  ws.onmessage=function(e){try{om(JSON.parse(e.data))}catch(err){lg('parse',err)}};
  ws.onclose=function(e){
    wr=false;clearInterval(pingT);
    lg('ws CLOSE',e.code);
    setBar('RECONNECT');
    retry++;
    setTimeout(wsConn,Math.min(800*retry,4000));
  };
  ws.onerror=function(){lg('ws ERR');setBar('LINK ERROR')};
}
function wsSend(o){if(ws&&ws.readyState===1){try{ws.send(JSON.stringify(o))}catch(e){}}}

/* ============== MESSAGE HANDLER ============== */
function om(m){
  var t=m.type;
  if(t==='pong'||t==='welcome')return;
  lg('<-',t);
  if(t==='registered'){
    my=m.no;localStorage.setItem('myNo',m.no);
    $('formReg').classList.add('h');
    $('formCall').classList.remove('h');
    $('idv').textContent=m.no;
    ts('✅ '+m.no,'k');
  }
  else if(t==='error'){matching=false;ts('❌ '+m.msg,'e')}
  else if(t==='force-logout'){ts('nomor dipakai HP lain','e');setTimeout(L,1500)}
  else if(t==='online'){
    if(m.list){lg('online:',m.list.join(','))}
  }
  else if(t==='match-target'){
    matching=false;
    ts('🎯 Match: '+m.no,'k');
    tg=m.no;caller=true;
    doCall(tg);
  }
  else if(t==='incoming-call'){
    po=m.offer;pf=m.from;
    $('ci').textContent=m.from;
    $('inc').classList.add('on');
    if(navigator.vibrate)navigator.vibrate([200,100,200]);
  }
  else if(t==='call-accepted'){onAccepted()}
  else if(t==='call-rejected'){ts('ditolak','e');cleanup()}
  else if(t==='call-ended'){ts('selesai');cleanup()}
  else if(t==='call-error'){ts(m.msg,'e');matching=false}
  else if(t==='answer'){onAnswer(m)}
  else if(t==='ice-candidate'){onIce(m)}
  else if(t==='peer-location'){
    peerLoc={lat:m.lat,lng:m.lng};
    updDist();
  }
}

/* ============== USER ACTIONS ============== */
function R(){
  var n=cl($('mn').value);
  if(!n)return ts('masukkan nomor','e');
  if(n.length<8)return ts('min 8 digit','e');
  if(!/^(0|62)?8\d{7,13}$/.test(n))return ts('format 08xxx','e');
  my=n;localStorage.setItem('myNo',n);
  if(wr){wsSend({type:'register',no:n});lg('reg sent')}
  else ts('menunggu koneksi...','e');
}

function C(){
  var t=cl($('tn').value);
  if(!t)return ts('masukkan nomor tujuan','e');
  if(t===my)return ts('tidak bisa diri sendiri','e');
  if(!wr)return ts('belum konek','e');
  tg=t;caller=true;
  doCall(t);
}

function M(){
  if(matching)return;
  if(!wr)return ts('belum konek','e');
  matching=true;
  ts('🔍 mencari...','k');
  wsSend({type:'match'});
}

function doCall(t){
  ts('memanggil '+t);
  getMic().then(function(){
    if(!pc)mkPC();
    return pc.createOffer();
  }).then(function(o){
    o.sdp=munge(o.sdp);
    return pc.setLocalDescription(o);
  }).then(function(){
    wsSend({type:'call-user',to:t,sdp:pc.localDescription});
  }).catch(function(e){ts('gagal: '+e.message,'e');lg('doCall',e.message)});
}

function A(){
  $('inc').classList.remove('on');
  if(!po)return ts('tidak ada offer','e');
  tg=pf;caller=false;
  ts('menyambung...');
  getMic().then(function(){
    if(!pc)mkPC();
    return pc.setRemoteDescription(new RTCSessionDescription(po));
  }).then(function(){rds=true;return flushICE()})
  .then(function(){return pc.createAnswer()})
  .then(function(a){a.sdp=munge(a.sdp);return pc.setLocalDescription(a)})
  .then(function(){
    wsSend({type:'answer',to:tg,sdp:pc.localDescription});
    po=null;
  }).catch(function(e){ts('gagal: '+e.message,'e');lg('A',e.message)});
}

function X(){ $('inc').classList.remove('on'); if(pf)wsSend({type:'reject-call',to:pf}); po=null;pf=null; }
function E(){ if(tg&&wr)wsSend({type:'end-call',to:tg}); cleanup(); ts('selesai'); }
function L(){ try{wsSend({type:'unregister'});E()}catch(e){} localStorage.removeItem('myNo'); setTimeout(function(){location.reload()},200); }
function U(){ ra.muted=false;ra.volume=1; ensurePlay(); ts('🔊 audio','k'); }

/* ============== PEER CONNECTION ============== */
function mkPC(){
  if(pc)return pc;
  if(!ls||!ls.getAudioTracks().length){lg('NO TRACK');return null}
  var tr=ls.getAudioTracks()[0];
  pc=new RTCPeerConnection({
    iceServers:[
      {urls:'stun:stun.l.google.com:19302'},
      {urls:'stun:stun.cloudflare.com:3478'}
    ],
    iceCandidatePoolSize:10,
    bundlePolicy:'max-bundle',
    rtcpMuxPolicy:'require'
  });
  pc.addTrack(tr,new MediaStream([tr]));
  /* prefer Opus */
  try{
    var caps=RTCRtpSender.getCapabilities('audio');
    if(caps&&caps.codecs){
      var opus=caps.codecs.filter(function(x){return x.mimeType.toLowerCase()==='audio/opus'});
      var rest=caps.codecs.filter(function(x){return x.mimeType.toLowerCase()!=='audio/opus'});
      var trans=pc.getTransceivers()[0];
      if(trans&&trans.setCodecPreferences)trans.setCodecPreferences([].concat(opus,rest));
    }
  }catch(e){}
  pc.ontrack=function(e){
    lg('ONTRACK',e.track.kind);
    rTrack=e.track;
    if(e.streams&&e.streams[0])rs=e.streams[0];
    else{if(!rs)rs=new MediaStream();rs.addTrack(e.track)}
    /* SINGLE PATH: <audio> saja */
    ra.srcObject=rs;
    ra.muted=false;
    ra.volume=1;
    ra.play().then(function(){lg('play OK')}).catch(function(err){lg('play err',err.message)});
    /* VU meter via AnalyserNode — TIDAK connect ke speaker */
    startVU(rs);
    e.track.onunmute=function(){lg('RX unmute');var l=$('led');if(l&&!l.classList.contains('tx'))l.classList.add('rx')};
    e.track.onmute=function(){var l=$('led');if(l)l.classList.remove('rx')};
  };
  pc.onicecandidate=function(e){
    if(e.candidate)wsSend({type:'ice-candidate',to:tg,candidate:e.candidate});
  };
  pc.onconnectionstatechange=function(){
    lg('PC',pc.connectionState);
    if(pc.connectionState==='connected'){
      $('pb').disabled=false;
      ts('✅ live','k');
      /* LOW LATENCY HINTS */
      applyLowLatency();
      setTimeout(applyLowLatency,500);
      setTimeout(applyLowLatency,1500);
      startRTT();
    }
  };
  return pc;
}

function applyLowLatency(){
  if(!pc)return;
  try{
    var all=[].concat(pc.getSenders(),pc.getReceivers());
    all.forEach(function(x){
      try{if('playoutDelayHint' in x)x.playoutDelayHint=0}catch(e){}
      try{if('jitterBufferTarget' in x)x.jitterBufferTarget=0}catch(e){}
      try{if(x.track&&'contentHint' in x.track)x.track.contentHint='speech'}catch(e){}
    });
    lg('⚡ lowlat applied');
  }catch(e){}
}

function flushICE(){
  if(!pc||!rds)return Promise.resolve();
  var c=Promise.resolve();
  while(pend.length){(function(ice){c=c.then(function(){return pc.addIceCandidate(ice).catch(function(){})})})(pend.shift())}
  return c;
}

function onAccepted(){
  if(!pc)mkPC();
  pc.createOffer().then(function(o){o.sdp=munge(o.sdp);return pc.setLocalDescription(o)})
    .then(function(){wsSend({type:'offer',to:tg,sdp:pc.localDescription})})
    .catch(function(e){lg('oA err',e.message)});
}

function onAnswer(m){
  if(!pc)return;
  pc.setRemoteDescription(new RTCSessionDescription(m.sdp))
    .then(function(){rds=true;return flushICE()})
    .catch(function(e){lg('ans err',e.message)});
}

function onIce(m){
  if(!pc)return;
  var c=new RTCIceCandidate(m.candidate);
  if(!rds){pend.push(c);return}
  pc.addIceCandidate(c).catch(function(){});
}

/* ============== PTT ============== */
function ST(e){
  if(e){e.preventDefault();if(e.stopPropagation)e.stopPropagation()}
  if(!ls)return ts('mic belum siap','e');
  /* 1) MUTE MIC SEMUA dulu — cegah kirim suara speaker */
  ls.getAudioTracks().forEach(function(t){t.enabled=false});
  /* 2) MUTE SPEAKER HP SENDIRI (via volume + track) */
  ra.volume=0;
  if(rTrack)rTrack.enabled=false;
  /* 3) BARU aktifkan track mic yang benar */
  var t=activeTx||ls.getAudioTracks()[0];
  if(t)t.enabled=true;
  $('pb').classList.add('on');
  $('led').classList.add('tx');
  $('led').classList.remove('rx');
  if(navigator.vibrate)navigator.vibrate(15);
  lg('PTT ON','txEnabled:',t&&t.enabled,'rTrack:',rTrack&&rTrack.enabled);
}
function SP(e){
  if(e){e.preventDefault();if(e.stopPropagation)e.stopPropagation()}
  /* 1) MUTE MIC SEMUA — kritis! */
  if(ls)ls.getAudioTracks().forEach(function(t){t.enabled=false});
  /* 2) UNMUTE SPEAKER */
  ra.volume=1;
  if(rTrack)rTrack.enabled=true;
  $('pb').classList.remove('on');
  $('led').classList.remove('tx');
  lg('PTT OFF');
}

/* ============== VU METER (read-only analyser) ============== */
function startVU(stream){
  try{
    if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'})}
    if(ac.state==='suspended')ac.resume().catch(function(){});
    if(!an){an=ac.createAnalyser();an.fftSize=256}
    var src=ac.createMediaStreamSource(stream);
    src.connect(an);
    /* TIDAK connect ke ac.destination — hanya baca level */
  }catch(e){lg('VU err',e.message);return}
  var d=new Uint8Array(an.frequencyBinCount);
  if(raf)cancelAnimationFrame(raf);
  var k=0;
  function tk(){
    an.getByteFrequencyData(d);
    if((k++&3)===0){
      var mv=0,mb=0,i;
      for(i=1;i<d.length;i++){if(d[i]>mv){mv=d[i];mb=i}}
      var hz=mb*ac.sampleRate/an.fftSize;
      var fv=$('fv');
      if(fv){
        if(mv<15){fv.textContent='--'}
        else{fv.textContent=(hz<1000?hz.toFixed(0)+'Hz':(hz/1000).toFixed(1)+'kHz')}
      }
      var led=$('led');
      if(led&&!led.classList.contains('tx'))led.classList.toggle('rx',mv>30);
    }
    raf=requestAnimationFrame(tk);
  }
  tk();
}

/* ============== RTT / DISTANCE ============== */
function startRTT(){
  if(rttTimer)clearInterval(rttTimer);
  rttTimer=setInterval(async function(){
    if(!pc||pc.connectionState!=='connected')return;
    try{
      var stats=await pc.getStats();
      var rtt=null;
      stats.forEach(function(r){
        if(r.type==='candidate-pair'&&r.state==='succeeded'&&r.nominated&&r.currentRoundTripTime!=null)rtt=r.currentRoundTripTime;
      });
      if(rtt!=null&&rtt>0){
        /* estimasi kasar: RTT/2 × kecepatan ~200,000 km/s */
        var km=Math.max(0,(rtt/2)*200000-500);
        var dv=$('dv');
        if(dv)dv.textContent=(km<1?(km*1000).toFixed(0)+'m':(km<1000?km.toFixed(1)+'km':(km/1000).toFixed(1)+'Mm'));
      }
    }catch(e){}
  },2000);
}

/* ============== CLEANUP ============== */
function cleanup(){
  try{if(pc)pc.close()}catch(e){}
  pc=null;
  try{if(ls)ls.getTracks().forEach(function(t){t.stop()})}catch(e){}
  ls=null;lp=null;rs=null;
  ra.srcObject=null;
  pend=[];rds=false;
  if(rttTimer){clearInterval(rttTimer);rttTimer=null}
  if(raf){cancelAnimationFrame(raf);raf=null}
  $('pb').disabled=true;
  $('pb').classList.remove('on');
  var l=$('led');if(l){l.classList.remove('tx');l.classList.remove('rx')}
  po=null;pf=null;tg='';caller=false;matching=false;
  var dv=$('dv');if(dv)dv.textContent='--';
  var fv=$('fv');if(fv)fv.textContent='--';
}

/* Watchdog: pastikan mic mute kalau tidak PTT */
setInterval(function(){
  if(!ls)return;
  var ptt=$('pb').classList.contains('on');
  if(!ptt){
    var anyOn=ls.getAudioTracks().some(function(t){return t.enabled});
    if(anyOn){
      ls.getAudioTracks().forEach(function(t){t.enabled=false});
      lg('⚠️ watchdog: mic force-mute');
    }
  }
},500);

<!DOCTYPE html><html lang=id><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name=theme-color content=#000><title>Walkie Talkie</title><style>
:root{--cy:#00fff7;--mg:#ff00e5;--lm:#39ff14;--yl:#f7ff00;--rd:#ff003c;--tx:#e0f7ff;--mu:#5a7a99}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Courier New',ui-monospace,monospace;color:var(--tx);min-height:100vh;padding:18px;background:#000;overflow-x:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,255,247,.03) 0 1px,transparent 1px 3px);pointer-events:none;z-index:1}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,.7) 100%);pointer-events:none;z-index:2}
.c{max-width:420px;margin:0 auto;padding:24px 20px 28px;background:linear-gradient(180deg,rgba(0,20,30,.85),rgba(5,0,20,.9));border:2px solid var(--cy);border-radius:4px;position:relative;z-index:3;box-shadow:0 0 20px rgba(0,255,247,.4),inset 0 0 40px rgba(0,255,247,.05)}
.c::before,.c::after{content:'';position:absolute;width:14px;height:14px;border:2px solid var(--mg);box-shadow:0 0 10px var(--mg)}
.c::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.c::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
h1{text-align:center;font-size:1.3rem;font-weight:900;letter-spacing:3px;text-transform:uppercase;margin-bottom:18px;color:var(--cy);text-shadow:0 0 8px var(--cy),2px 2px 0 var(--mg),-1px -1px 0 var(--mg)}
h1::before{content:'▶';color:var(--mg);margin-right:8px;text-shadow:0 0 10px var(--mg)}
h1::after{content:'◀';color:var(--mg);margin-left:8px;text-shadow:0 0 10px var(--mg)}
.bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;border:1px solid var(--cy);border-radius:2px;font-size:.72rem;margin-bottom:14px;background:rgba(0,255,247,.05);letter-spacing:1px;text-transform:uppercase;color:var(--cy);text-shadow:0 0 6px var(--cy);word-break:break-all}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rd);box-shadow:0 0 8px var(--rd);animation:bl 1.2s infinite;flex-shrink:0}
.dot.on{background:var(--lm);box-shadow:0 0 8px var(--lm)}
.dot.wn{background:var(--yl);box-shadow:0 0 8px var(--yl)}
@keyframes bl{50%{opacity:.3}}
.ig{display:flex;gap:8px;margin-bottom:10px}
input{flex:1;padding:12px 14px;border:1px solid var(--cy);border-radius:2px;background:rgba(0,0,0,.7);color:var(--cy);font-size:.95rem;font-family:inherit;outline:none;text-shadow:0 0 4px var(--cy);letter-spacing:1px;min-width:0}
input::placeholder{color:var(--mu);text-shadow:none;letter-spacing:0}
input:focus{border-color:var(--mg);box-shadow:0 0 12px var(--mg);color:var(--mg)}
input:disabled{opacity:.4}
button{padding:12px 16px;border:1px solid var(--cy);border-radius:2px;font-size:.85rem;font-weight:900;cursor:pointer;background:rgba(0,255,247,.08);color:var(--cy);font-family:inherit;letter-spacing:2px;text-transform:uppercase;transition:.15s;touch-action:manipulation;user-select:none;text-shadow:0 0 6px var(--cy);box-shadow:0 0 10px rgba(0,255,247,.2);flex-shrink:0}
button:disabled{opacity:.35;cursor:not-allowed}
button:not(:disabled):active{transform:scale(.94);background:var(--cy);color:#000;text-shadow:none;box-shadow:0 0 24px var(--cy)}
.s{border-color:var(--lm);color:var(--lm);text-shadow:0 0 6px var(--lm)}
.s:not(:disabled):active{background:var(--lm);color:#000}
.d{border-color:var(--rd);color:var(--rd);text-shadow:0 0 6px var(--rd)}
.d:not(:disabled):active{background:var(--rd);color:#000}
.w{border-color:var(--yl);color:var(--yl);text-shadow:0 0 6px var(--yl)}
.w:not(:disabled):active{background:var(--yl);color:#000}
.st{text-align:center;padding:10px 12px;border:1px solid rgba(0,255,247,.3);border-radius:2px;background:rgba(0,255,247,.03);font-size:.75rem;color:var(--mu);word-break:break-word;margin:6px 0;letter-spacing:.5px}
.st.err{color:var(--rd);border-color:var(--rd);background:rgba(255,0,60,.08);text-shadow:0 0 6px var(--rd)}
.st.ok{color:var(--lm);border-color:var(--lm);background:rgba(57,255,20,.05);text-shadow:0 0 6px var(--lm)}
#ms{color:var(--cy);font-weight:700;text-shadow:0 0 6px var(--cy);letter-spacing:1px}
#ms::before{content:'> ';color:var(--mg)}
#ol{font-size:.7rem;opacity:.8}
#ol::before{content:'// '}
.ptt{width:100%;padding:22px;font-size:1rem;font-weight:900;letter-spacing:3px;border-radius:60px;margin-top:14px;color:var(--lm);background:radial-gradient(circle at 50% 50%,rgba(57,255,20,.15),transparent 70%),rgba(0,0,0,.8);border:2px solid var(--lm);text-shadow:0 0 10px var(--lm);box-shadow:0 0 20px rgba(57,255,20,.5);user-select:none;flex:none;transition:.15s}
.ptt.on{background:radial-gradient(circle at 50% 50%,rgba(255,0,229,.3),transparent 70%),rgba(0,0,0,.9);border-color:var(--mg);color:var(--mg);text-shadow:0 0 10px var(--mg);box-shadow:0 0 30px var(--mg),0 0 60px var(--mg)}
.ptt:disabled{opacity:.3}
.nf{background:rgba(0,0,0,.9);border:2px solid var(--yl);border-radius:2px;padding:16px;margin:12px 0;text-align:center;display:none;box-shadow:0 0 20px var(--yl);animation:ni .3s ease}
.nf.on{display:block}
@keyframes ni{from{opacity:0;transform:scale(.9)}}
.nf p{margin-bottom:10px;font-size:.9rem;color:var(--yl);text-shadow:0 0 8px var(--yl);letter-spacing:1px}
.nf b{color:var(--cy);text-shadow:0 0 8px var(--cy);font-size:1rem}
.nf button{margin:4px 3px 0;min-width:100px}
.h{display:none!important}
.vw{height:14px;border:1px solid var(--cy);border-radius:2px;overflow:hidden;margin:10px 0 4px;background:rgba(0,0,0,.8)}
.vu{height:100%;width:0;background:linear-gradient(90deg,var(--lm),var(--cy) 40%,var(--yl) 70%,var(--mg) 100%);box-shadow:0 0 12px var(--cy);transition:width .06s linear}
#ah{font-size:.68rem;padding:4px;margin:0 0 4px;background:transparent;border:none;color:var(--mu);letter-spacing:1px}
#ah::before{content:'[ ';color:var(--cy)}
#ah::after{content:' ]';color:var(--cy)}
.r{display:flex;gap:8px;margin-top:10px}
.r button{flex:1}
.ts{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);background:rgba(0,0,0,.95);border:2px solid var(--cy);padding:12px 18px;border-radius:2px;font-size:.8rem;z-index:999;box-shadow:0 0 20px var(--cy);color:var(--cy);text-shadow:0 0 6px var(--cy);transition:.35s;max-width:90vw;text-align:center;pointer-events:none;letter-spacing:1px;text-transform:uppercase}
.ts.on{transform:translateX(-50%) translateY(0)}
.ts.err{border-color:var(--rd);color:var(--rd);text-shadow:0 0 6px var(--rd)}
.ts.ok{border-color:var(--lm);color:var(--lm);text-shadow:0 0 6px var(--lm)}
</style></head><body>
<div class=ts id=ts></div>
<div class=c>
<h1>Walkie Talkie</h1>
<div class=bar><span class=dot id=dot></span><span id=nt>INITIALIZING...</span></div>
<div id=rs><div class=ig><input type=tel id=mn placeholder="Nomor HP (08...)" inputmode=numeric autocomplete=off maxlength=15><button id=rb onclick=R() disabled>Daftar</button></div></div>
<div id=cs class=h>
<div class=st id=ms>-</div>
<div class=st id=ol>ONLINE: -</div>
<div class=ig><input type=tel id=tn placeholder="Nomor tujuan" inputmode=numeric autocomplete=off maxlength=15><button class=s id=cb onclick=C()>Panggil</button></div>
<div class=vw><div class=vu id=vu></div></div>
<div class=st id=ah>AUDIO LEVEL</div>
<button class=ptt id=pb disabled onclick=M()>🎙 MIC ON — TAP TO MUTE</button>
<div class=r><button class=d onclick=E()>Akhiri</button><button class=w onclick=U(1)>🔊 Suara</button></div>
<div class=r><button onclick=L()>Ganti Nomor</button></div>
</div>
<div class=nf id=nf><p>📞 <b id=ci></b> INCOMING CALL</p><button class=s onclick=A()>Ya</button><button class=d onclick=X()>Tidak</button></div>
</div>
<script>
'use strict';
const $=i=>document.getElementById(i),cl=n=>String(n||'').replace(/\D/g,''),lg=(...a)=>console.log('[WT]',...a);
let tt=null;const ts=(m,t='')=>{const e=$('ts');e.textContent=m;e.className='ts on '+t;clearTimeout(tt);tt=setTimeout(()=>e.className='ts '+t,3200)};
const WS_URL=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
let ws=null,wsReady=false,retry=0,pingT=null;
let my=localStorage.getItem('myNo')||'',tg='',caller=0,pc=null,ls=null,rst=null,pend=[],rds=0,mo=0,ac=null,an=null,raf=null,rp=0,rt=null,micMuted=false;
const net=(s,t)=>{$('dot').className='dot'+(s==='ok'?' on':(s==='w'?' wn':''));$('nt').textContent=t;$('rb').disabled=s!=='ok';$('cb').disabled=s!=='ok'};
function rbReset(){$('rb').textContent='Daftar';$('rb').disabled=0;$('mn').disabled=0}
fetch('/prewarm').catch(()=>{});
function acInit(){if(ac)return ac;try{ac=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive',sampleRate:48000})}catch{try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch{}}return ac}
function acResume(){acInit();if(ac&&ac.state==='suspended')ac.resume().catch(()=>{})}
// ===== MIC: JANGAN disable track! =====
async function gm(){
  if(ls)return ls;
  if(!navigator.mediaDevices)throw Error('Browser tidak dukung mic');
  lg('getUserMedia...');
  ls=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1},video:false});
  const t=ls.getAudioTracks()[0];
  lg('mic OK label=',t.label,'enabled=',t.enabled);
  return ls;
}
(async()=>{try{await gm();acInit();lg('pre-mic OK')}catch(e){lg('pre-mic butuh gesture:',e.message)}})();
document.addEventListener('touchstart',async()=>{acResume();if(!ls){try{await gm();acResume()}catch(e){}}},{once:true,passive:true});
document.addEventListener('click',async()=>{acResume();if(!ls){try{await gm();acResume()}catch(e){}}},{once:true});
// ===== PC =====
function cp(){
  if(pc)return pc;
  lg('create PC');
  pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.cloudflare.com:3478'},{urls:'stun:stun.l.google.com:19302'}],iceCandidatePoolSize:10,bundlePolicy:'max-bundle',rtcpMuxPolicy:'require'});
  ls.getTracks().forEach(t=>{pc.addTrack(t,ls);lg('addTrack',t.kind,'enabled=',t.enabled)});
  try{const caps=RTCRtpSender.getCapabilities('audio');if(caps&&caps.codecs){const opus=caps.codecs.filter(c=>c.mimeType.toLowerCase()==='audio/opus');const rest=caps.codecs.filter(c=>c.mimeType.toLowerCase()!=='audio/opus');pc.getTransceivers().forEach(tr=>{if(tr.setCodecPreferences)tr.setCodecPreferences([...opus,...rest])})}}catch(e){}
  pc.ontrack=e=>{
    lg('ontrack',e.track.kind,'enabled=',e.track.enabled);
    if(e.streams&&e.streams[0])rst=e.streams[0];
    else{if(!rst)rst=new MediaStream();rst.addTrack(e.track)}
    // Attach ke <audio> (bisa volume)
    let ra=$('ra');
    if(!ra){ra=document.createElement('audio');ra.id='ra';ra.autoplay=true;ra.playsInline=true;document.body.appendChild(ra)}
    ra.srcObject=rst;ra.muted=false;ra.volume=1;
    const tryPlay=()=>{ra.play().then(()=>{lg('audio play OK');$('ah').textContent='🎧 LISTENING (REMOTE AUDIO OK)'}).catch(err=>{lg('audio play FAIL',err.message);$('ah').textContent='⚠️ TAP "Suara" UNTUK AKTIFKAN')})};
    tryPlay();
    setTimeout(tryPlay,500);
    setTimeout(tryPlay,1500);
    // Fallback: mainkan via AudioContext juga
    try{acInit();if(ac){const src=ac.createMediaStreamSource(rst);const gain=ac.createGain();gain.gain.value=1;src.connect(gain).connect(ac.destination);lg('AudioContext fallback attached')}}catch(err){lg('ac fallback err',err.message)}
    mt(rst);
    e.track.onunmute=()=>lg('remote track UNMUTED');
    e.track.onmute=()=>lg('remote track MUTED');
  };
  pc.onicecandidate=e=>{if(e.candidate)wsSend({type:'ice-candidate',to:tg,candidate:e.candidate})};
  pc.oniceconnectionstatechange=()=>lg('ICE state:',pc.iceConnectionState);
  pc.onconnectionstatechange=()=>{
    lg('PC state:',pc.connectionState);
    if(pc.connectionState==='connected'){
      $('ms').textContent='LIVE: '+tg;$('ms').className='st ok';
      $('pb').disabled=false;acResume();
      if(!micMuted)$('pb').textContent='🎙 MIC ON — TAP TO MUTE';
      ts('✅ LIVE','ok');
    } else if(pc.connectionState==='failed'){$('ms').textContent='❌ FAILED';try{pc.restartIce()}catch(_){}}
    else if(pc.connectionState==='disconnected')$('ms').textContent='⚠️ DISCONNECTED';
  };
  return pc;
}
function prewarmPC(){if(ls&&!pc){cp();lg('PC pre-warmed')}}
async function fc(){if(!pc||!rds)return;while(pend.length){const c=pend.shift();try{await pc.addIceCandidate(c)}catch(e){}}}
function mt(s){
  acInit();if(!ac)return;
  try{const src=ac.createMediaStreamSource(s);if(!an){an=ac.createAnalyser();an.fftSize=512}src.connect(an)}catch(e){lg('meter err',e.message);return}
  const d=new Uint8Array(an.frequencyBinCount);cancelAnimationFrame(raf);
  const tk=()=>{an.getByteFrequencyData(d);let x=0;for(let i=0;i<d.length;i++)x+=d[i];$('vu').style.width=Math.min(100,x/d.length*2.5)+'%';raf=requestAnimationFrame(tk)};tk();
}
function wsConn(){
  lg('WS ->',WS_URL);net('w','CONNECTING...');
  try{ws=new WebSocket(WS_URL)}catch(e){net('','LINK ERROR');setTimeout(wsConn,1500);return}
  ws.onopen=()=>{
    wsReady=true;retry=0;lg('ws OPEN');net('ok','SYSTEM ONLINE');
    if(my){wsSend({type:'register',no:my});rp=1;clearTimeout(rt);rt=setTimeout(()=>{if(rp){ts('Timeout','err');rp=0;rbReset()}},8e3)}
    clearInterval(pingT);pingT=setInterval(()=>wsSend({type:'ping'}),20000);
  };
  ws.onmessage=e=>{try{onMsg(JSON.parse(e.data))}catch(err){lg('parse',err)}};
  ws.onclose=ev=>{wsReady=false;clearInterval(pingT);lg('ws CLOSED',ev.code);net('w','RECONNECTING...');retry++;setTimeout(wsConn,Math.min(800*retry,4000))};
  ws.onerror=()=>{lg('ws ERROR');net('','LINK ERROR')};
}
function wsSend(o){if(ws&&ws.readyState===1){try{ws.send(JSON.stringify(o))}catch(e){}}else lg('ws not ready',o.type)}
function onMsg(m){
  const t=m.type;
  if(t==='pong'||t==='welcome')return;
  lg('<-',t);
  if(t==='registered'){
    rp=0;clearTimeout(rt);
    my=m.no;localStorage.setItem('myNo',m.no);
    $('rs').classList.add('h');$('cs').classList.remove('h');
    $('ms').textContent='ID: '+m.no;$('ms').className='st ok';
    rbReset();ts('✅ '+m.no,'ok');prewarmPC();
  }
  else if(t==='error'){rp=0;clearTimeout(rt);rbReset();ts('❌ '+m.msg,'err')}
  else if(t==='online'){$('ol').textContent='ONLINE: '+(m.list.join(', ')||'none')}
  else if(t==='force-logout'){ts('Nomor dipakai di device lain','err');setTimeout(L,1500)}
  else if(t==='incoming-call'){acResume();$('ci').textContent=m.from;$('nf').classList.add('on');navigator.vibrate&&navigator.vibrate([200,100,200])}
  else if(t==='call-accepted'){onAcc()}
  else if(t==='call-rejected'){$('ms').textContent='CALL REJECTED';cl_()}
  else if(t==='call-ended'){$('ms').textContent='CALL ENDED';cl_()}
  else if(t==='call-error'){ts(m.msg,'err');$('ms').textContent=m.msg;$('ms').className='st err'}
  else if(t==='offer'){onOffer(m)}
  else if(t==='answer'){onAnswer(m)}
  else if(t==='ice-candidate'){onIce(m)}
}
async function onAcc(){
  try{
    acResume();
    if(!ls)await gm();
    if(!pc)cp();
    $('ms').textContent='CONNECTING...';
    mo=1;const offer=await pc.createOffer();await pc.setLocalDescription(offer);
    wsSend({type:'offer',to:tg,sdp:pc.localDescription});mo=0;
  }catch(e){lg('cstart',e);ts('Gagal: '+e.message,'err')}
}
async function onOffer(m){
  try{
    acResume();
    if(!ls)await gm();
    if(!pc)cp();
    const col=mo||pc.signalingState!=='stable';
    if(col&&!caller)return;
    await pc.setRemoteDescription(new RTCSessionDescription(m.sdp));
    rds=1;await fc();
    const a=await pc.createAnswer();await pc.setLocalDescription(a);
    wsSend({type:'answer',to:m.from||tg,sdp:pc.localDescription});
  }catch(e){lg('off',e)}
}
async function onAnswer(m){
  try{
    if(!pc)return;
    await pc.setRemoteDescription(new RTCSessionDescription(m.sdp));
    rds=1;await fc();
  }catch(e){lg('ans',e)}
}
async function onIce(m){
  if(!pc)return;const c=new RTCIceCandidate(m.candidate);
  if(!rds){pend.push(c);return}
  try{await pc.addIceCandidate(c)}catch(e){}
}
function U(a){acResume();const ra=$('ra');if(ra){ra.muted=false;ra.volume=1;ra.play().then(()=>{if(a)$('ah').textContent='🔊 AUDIO AKTIF'}).catch(e=>{if(a)$('ah').textContent='⚠️ Tap lagi'})}else{if(a)$('ah').textContent='⚠️ Belum ada audio'}}
function R(){
  const n=cl($('mn').value);
  if(!n)return ts('Masukkan nomor','err');
  if(n.length<8)return ts('Nomor < 8 digit','err');
  if(n.length>15)return ts('Nomor terlalu panjang','err');
  if(!/^(0|62)?8\d{7,13}$/.test(n))return ts('Format 08xxx','err');
  if(!wsReady)return ts('Belum konek','err');
  my=n;localStorage.setItem('myNo',n);rp=1;
  wsSend({type:'register',no:n});
  $('rb').textContent='...';$('rb').disabled=1;$('mn').disabled=1;
  clearTimeout(rt);rt=setTimeout(()=>{if(rp){ts('Timeout','err');rp=0;rbReset()}},8e3);
}
function L(){try{wsSend({type:'unregister'});E()}catch(_){}localStorage.removeItem('myNo');setTimeout(()=>location.reload(),200)}
function C(){
  acResume();
  tg=cl($('tn').value);
  if(!tg)return ts('Masukkan nomor','err');
  if(tg===my)return ts('Tidak bisa panggil diri','err');
  if(!wsReady)return ts('Belum konek','err');
  caller=1;
  wsSend({type:'call-user',to:tg});
  $('ms').textContent='CALLING '+tg+'...';$('ms').className='st';
  if(!ls)gm().then(()=>prewarmPC()).catch(()=>{});
}
async function A(){
  acResume();
  $('nf').classList.remove('on');
  tg=$('ci').textContent;caller=0;
  $('ms').textContent='PREPARING...';
  try{
    if(!ls)await gm();
    if(!pc)cp();
    wsSend({type:'accept-call',to:tg});
    $('ms').textContent='WAITING OFFER...';
  }catch(e){ts('Mic gagal: '+e.message,'err')}
}
function X(){$('nf').classList.remove('on');wsSend({type:'reject-call',to:$('ci').textContent})}
function E(){if(tg&&wsReady)wsSend({type:'end-call',to:tg});cl_();$('ms').textContent='CALL ENDED';$('ms').className='st'}
function cl_(){
  try{pc&&pc.close()}catch(_){}pc=null;
  try{ls&&ls.getTracks().forEach(t=>t.stop())}catch(_){}ls=null;
  rst=null;
  const ra=$('ra');if(ra)ra.srcObject=null;
  pend=[];rds=0;cancelAnimationFrame(raf);$('vu').style.width='0';
  micMuted=false;$('pb').disabled=true;$('pb').classList.remove('on');$('pb').textContent='🎙 MIC ON — TAP TO MUTE';
}
function M(){
  acResume();
  if(!ls)return;
  micMuted=!micMuted;
  ls.getAudioTracks().forEach(t=>{t.enabled=!micMuted});
  $('pb').classList.toggle('on',micMuted);
  $('pb').textContent=micMuted?'🔇 MIC OFF — TAP TO UNMUTE':'🎙 MIC ON — TAP TO MUTE';
  if(navigator.vibrate)navigator.vibrate(20);
  lg('mic',micMuted?'MUTED':'ON');
}
wsConn();
</script></body></html>

.b2{background:var(--lm);color:#001a0d}

.h{display:none!important}
.ts{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--cd);border:1px solid var(--bd);padding:11px 18px;border-radius:10px;font-size:.75rem;z-index:999;transition:.3s;max-width:90vw;text-align:center;pointer-events:none;letter-spacing:.5px}
.ts.on{transform:translateX(-50%) translateY(0)}
.ts.e{border-color:var(--rd);color:var(--rd)}

.ob.on{transform:translateY(0)}
audio{display:none}
</style></head><body>

</div>

<script>
'use strict';
const $=i=>document.getElementById(i),cl=n=>String(n||'').replace(/\D/g,''),lg=(...a)=>console.log('[WT]',...a);

let lp=null;

function cp(){

    if((k++&3)===0){let mv=0,mb=0;for(let i=1;i<d.length;i++)if(d[i]>mv){mv=d[i];mb=i}const hz=mb*ac.sampleRate/an.fftSize;const led=$("led");if(led&&!led.classList.contains("tx"))led.classList.toggle("rx",mv>30);
      if(mv<15){$('fv').textContent='—'}else{$('fv').textContent=hz<1000?hz.toFixed(0):(hz/1000).toFixed(2);$('fu').textContent=hz<1000?'Hz':'kHz'}}

}
function hav(a,b){const R=6371000,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}

async function ud(){
  if(myLoc&&peerLoc){
    const d=hav(myLoc,peerLoc);
    if(d<1000){$('dv').textContent=d.toFixed(0);$('du').textContent='m'}
    else if(d<10000){$('dv').textContent=(d/1000).toFixed(2);$('du').textContent='km'}

async function C(){

    st.textContent='.seg{width:100%;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset -2px 0 2px rgba(0,0,0,.5)}.seg.s1{flex:1;background:linear-gradient(180deg,#3a3a48,#22222c);border-bottom:2px solid #0a0a0f}.seg.s2{flex:1;background:linear-gradient(180deg,#2a2a35,#16161e);width:80%;border-bottom:2px solid #0a0a0f}.seg.s3{flex:1;background:linear-gradient(180deg,#1e1e28,#0d0d12);width:60%}.tip{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3a3a44,#0a0a0f);box-shadow:inset 0 -2px 3px rgba(0,0,0,.6),0 0 4px rgba(0,224,255,.15);margin-top:-2px}';
    document.head.appendChild(st);

}

function ll(){
  if(!pc)return;
  try{
    const all=[...pc.getSenders(),...pc.getReceivers()];
    all.forEach(x=>{
      try{if('playoutDelayHint'in x)x.playoutDelayHint=0}catch(_){}
      try{if('jitterBufferTarget'in x)x.jitterBufferTarget=0}catch(_){}
      try{if(x.track&&x.track.contentHint!==undefined)x.track.contentHint='speech'}catch(_){}
    });
    lg('⚡lowlat',all.length,'nodes');
  }catch(e){lg('ll err',e.message)}
}

async function rttWatchdog(){
  if(!pc||pc.connectionState!=='connected')return;
  try{
    const s=await pc.getStats();let rtt=null;
    s.forEach(r=>{if(r.type==='candidate-pair'&&r.state==='succeeded'&&r.nominated&&r.currentRoundTripTime!=null)rtt=r.currentRoundTripTime});
    if(rtt&&rtt>0){
      const ms=rtt*1000;
      if(ms>lastRtt*1.5&&ms>80){rttWarn++;lg('⚠️ RTT naik',ms.toFixed(0),'ms → reapply ll');ll();if(rttWarn>3){try{pc.restartIce();rttWarn=0}catch(_){}}}
      else rttWarn=0;
      lastRtt=ms;
    }
  }catch(e){}
}

function ptimeMunge(sdp){
  if(!sdp)return sdp;
  return sdp.replace(/a=fmtp:(\d+) ([^\r\n]*)/g,(m,pt,params)=>{
    if(!/opus/i.test(params))return m;
    let p=params.replace(/minptime=\d+/g,'').replace(/useinbandfec=\d+/g,'').replace(/usedtx=\d+/g,'');
    p=p.trim()+' minptime=10;useinbandfec=0;usedtx=0';
    return 'a=fmtp:'+pt+' '+p;
  });
}
let echoGate=0,micGate=0,micAnalyser=null,micSource=null,micData=null,gateRaf=null,lastVoice=0;
const GATE_NAMES=['NORMAL','ECHO-GATE','CLEAN-GATE'];
function buildGateBtn(){
  if(document.getElementById('gbtn'))return;
  // Cari target: .keys, .body, .wrap, atau fallback body
  const target=document.querySelector('.keys')||document.querySelector('.body')||document.querySelector('.wrap')||document.body;
  if(!target){setTimeout(buildGateBtn,300);return}
  const b=document.createElement('button');
  b.id='gbtn';b.textContent='◎';b.title='Echo/Clean Gate';
  b.style.cssText='position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,#2a2a35,#15151c);border:2px solid #2a2a35;color:#888;font-size:1.6rem;font-family:inherit;cursor:pointer;z-index:99;box-shadow:0 4px 12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);transition:.2s;display:flex;align-items:center;justify-content:center;padding:0;line-height:1';
  b.onclick=toggleGate;
  document.body.appendChild(b);
  lg('🎛️ Tombol gate di-inject (universal)');
}
function toggleGate(){
  echoGate=(echoGate+1)%3;
  const b=document.getElementById('gbtn');
  const led=document.getElementById('led');
  if(b){
    b.textContent=['◎','◉','◍'][echoGate];
    b.style.borderColor=['#2a2a35','#00e0ff','#00ff88'][echoGate];
    b.style.color=['#888','#00e0ff','#00ff88'][echoGate];
    b.style.boxShadow=echoGate===0?'0 4px 12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1)':`0 0 20px ${['#2a2a35','#00e0ff','#00ff88'][echoGate]}`;
  }
  ts('🎛️ '+GATE_NAMES[echoGate],echoGate===0?'':'k');
  lg('Gate →',GATE_NAMES[echoGate]);
  if(echoGate===2){startMicGate()}else{stopMicGate()}
  if(echoGate===0&&led)led.classList.remove('echo');
}
function startMicGate(){
  if(micGate)return;micGate=1;
  try{
    if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'})}catch{return}}
    if(ac.state==='suspended')ac.resume().catch(()=>{});
    if(!ls||!ls.getAudioTracks().length)return;
    if(!micAnalyser){micAnalyser=ac.createAnalyser();micAnalyser.fftSize=256}
    micSource=ac.createMediaStreamSource(ls);
    micSource.connect(micAnalyser);
    micData=new Uint8Array(micAnalyser.frequencyBinCount);
    const loop=()=>{
      if(!micGate||!micData){gateRaf=null;return}
      micAnalyser.getByteFrequencyData(micData);
      let x=0;for(let i=0;i<micData.length;i++)x+=micData[i];
      const avg=x/micData.length;
      // Threshold: 4 (0-255). Kalau di bawah → mute mic (noise gate)
      const t=ls.getAudioTracks()[0];
      if(t){
        const pttOn=document.getElementById('pb').classList.contains('on');
        if(pttOn){
          if(avg<4){t.enabled=false}else{t.enabled=true}
        }
      }
      gateRaf=requestAnimationFrame(loop);
    };
    loop();
    lg('🎤 CLEAN-GATE aktif');
  }catch(e){lg('micGate err',e.message)}
}
function stopMicGate(){
  micGate=0;
  if(gateRaf){cancelAnimationFrame(gateRaf);gateRaf=null}
  try{micSource&&micSource.disconnect()}catch(_){}
  micSource=null;
  lg('🎤 mic gate off');
}
function applyEchoGate(){
  // Dipanggil dari ST(): kalau echoGate=1, mute RA saat TX
  if(echoGate===1){
    ra.volume=0;
    const led=document.getElementById('led');if(led)led.classList.add('echo');
  }else{
    ra.volume=.3;
  }
}
function releaseEchoGate(){
  ra.volume=1;
  const led=document.getElementById('led');if(led)led.classList.remove('echo');
}

name = "walkie-talkie"
main = "src/index.js"
compatibility_date = "2024-06-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[durable_objects]
bindings = [{ name = "ROOM", class_name = "Room" }]

[[migrations]]
tag = "v1"
new_classes = ["Room"]

[observability]
enabled = true

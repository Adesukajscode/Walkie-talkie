name = "walkie-talkie"
main = "src/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[durable_objects]
bindings = [{ name = "ROOM", class_name = "RoomV2" }]

[[migrations]]
tag = "v1"
new_classes = ["Room"]

[[migrations]]
tag = "v3"
renamed_classes = [{ from = "Room", to = "RoomV2" }]

[observability]
enabled = true

name = "walkie-talkie"
main = "src/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[durable_objects]
bindings = [{ name = "ROOM", class_name = "RoomV2" }]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RoomV2"]

[observability]
enabled = true
